<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Crea fichas de personaje con las clases del compendio y las razas y clases del Manual del Jugador.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya:wght@400;500;700&family=IM+Fell+English+SC&family=Shippori+Mincho+B1:wght@700;800&family=UnifrakturCook:wght@700&family=Cinzel:wght@600;700&display=swap">
<title>Personajes · Compendio</title>
<style>
/* ——— Tokens: los mismos que el compendio ——— */
:root{
  --bg:#f5f5f7;--card:#ffffff;--text:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);
  --chip:#e8e8ed;--zebra:#fafafc;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --nav:rgba(245,245,247,.78);--blue:#0071e3;--campo:#f5f5f7;--aviso:#c4441b;
  --acento:#0071e3;--acento2:#5ac8fa;--titulo:-apple-system,"SF Pro Display","Segoe UI",sans-serif;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:rgba(255,255,255,.12);
    --chip:#2c2c2e;--zebra:#161618;--shadow:none;--nav:rgba(20,20,22,.78);--blue:#2997ff;--campo:#2c2c2e;--aviso:#ff8a5c;color-scheme:dark;
  }
  :root:not([data-theme="light"]) [data-vol="rueda"],:root:not([data-theme="light"]) [data-vol="eberron"]{--acento:#e3b859}
  :root:not([data-theme="light"]) [data-vol="bloodborne"]{--acento:#9aa8bd}
  :root:not([data-theme="light"]) [data-vol="sueltas"]{--acento:#d9915f}
  :root:not([data-theme="light"]) [data-vol="castlevania"]{--acento:#e0445a}
}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:rgba(255,255,255,.12);
  --chip:#2c2c2e;--zebra:#161618;--shadow:none;--nav:rgba(20,20,22,.78);--blue:#2997ff;--campo:#2c2c2e;--aviso:#ff8a5c;color-scheme:dark;
}
[data-vol="jjk"]{--acento:#e0463a;--titulo:"Shippori Mincho B1","Yu Mincho",serif}
[data-vol="castlevania"]{--acento:#c2263a;--titulo:"UnifrakturCook",Georgia,serif}
[data-vol="rueda"]{--acento:#c99a3a;--titulo:"Cinzel",Georgia,serif}
[data-vol="cosmere"]{--acento:#4f8fe8}
[data-vol="eberron"]{--acento:#b8891f;--titulo:"Alegreya SC",Georgia,serif}
[data-vol="bloodborne"]{--acento:#6b7a90;--titulo:"IM Fell English SC",Georgia,serif}
[data-vol="sueltas"]{--acento:#b86f3f;--titulo:"Alegreya",Georgia,serif}
:root[data-theme="dark"] [data-vol="rueda"],:root[data-theme="dark"] [data-vol="eberron"]{--acento:#e3b859}
:root[data-theme="dark"] [data-vol="bloodborne"]{--acento:#9aa8bd}
:root[data-theme="dark"] [data-vol="sueltas"]{--acento:#d9915f}
:root[data-theme="dark"] [data-vol="castlevania"]{--acento:#e0445a}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}

/* ——— Barra ——— */
.barra{position:sticky;top:0;z-index:12;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.barra .wrap{display:flex;align-items:center;gap:12px;height:52px}
.barra strong{font-size:15px;font-weight:600}
.barra .sep{color:var(--sub);opacity:.5}
.barra .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:999px;background:var(--chip);padding:7px 14px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--text);color:var(--bg)}
.btn.prim{background:var(--acento);color:#fff}
.btn.peligro:hover{background:var(--aviso);color:#fff}
.tema{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:var(--chip);cursor:pointer;display:grid;place-items:center;font-size:15px}

/* ——— Disposición ——— */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;padding-block:28px 64px;align-items:start}
.lista{position:sticky;top:76px;display:flex;flex-direction:column;gap:6px}
.lista h2{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.lista .pj{display:block;width:100%;text-align:left;border:0;background:none;border-radius:12px;padding:9px 12px;cursor:pointer;line-height:1.25}
.lista .pj small{display:block;color:var(--sub);font-size:12px}
.lista .pj:hover{background:var(--chip)}
.lista .pj[aria-current="true"]{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.lista .acciones{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lista .acciones .btn{font-size:13px;padding:6px 11px}

.hoja{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.panel{grid-column:span 12;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;border-top:3px solid var(--acento);min-width:0}
.panel h2{margin:0 0 14px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acento)}
.panel h3{margin:18px 0 8px;font-size:16px}
.p6{grid-column:span 6}.p4{grid-column:span 4}.p8{grid-column:span 8}
.cabecera{display:flex;flex-wrap:wrap;align-items:end;gap:12px 28px;margin-bottom:4px}
.cabecera input.nombre{font:700 clamp(28px,4vw,40px)/1.1 var(--titulo);border:0;background:none;padding:0;min-width:0;width:100%;letter-spacing:-.02em}
.cabecera .resumen{color:var(--sub);font-size:15px}

/* ——— Campos ——— */
.campos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:12px 16px}
label.campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;min-width:0}
label.campo input,label.campo select,label.campo textarea,.entrada{border:1px solid var(--line);background:var(--campo);border-radius:10px;padding:8px 10px;font-size:15px;color:var(--text);text-transform:none;letter-spacing:0;min-width:0;width:100%}
textarea{resize:vertical;min-height:110px;line-height:1.5}
.nota{margin:8px 0 0;color:var(--sub);font-size:13px}
.aviso{color:var(--aviso)}

/* ——— Características ——— */
.metodos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.metodos button{border:0;border-radius:999px;background:var(--chip);padding:7px 13px;font-size:14px;cursor:pointer}
.metodos button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.cars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.car{background:var(--campo);border-radius:16px;padding:12px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.car .et{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--sub)}
.car .mod{font:700 30px/1 var(--titulo);color:var(--text)}
.car .tot{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.car input,.car select{width:64px;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px;font-size:15px}
.car .paso{display:flex;align-items:center;gap:6px}
.car .paso button{width:26px;height:26px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:15px;line-height:1}
.car .paso button:disabled{opacity:.35;cursor:default}
.car .base{font-weight:600;font-variant-numeric:tabular-nums;min-width:22px}
.car .rac{font-size:12px;color:var(--acento);min-height:16px}
.eleccion{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:14px}
.eleccion label{display:inline-flex;gap:6px;align-items:center}

/* ——— Números grandes ——— */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.stat{background:var(--campo);border-radius:14px;padding:10px 12px;text-align:center}
.stat b{display:block;font:700 24px/1.1 var(--titulo);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.stat span{display:block}
.stat input,.stat select{display:block;margin:0 auto 2px;width:70px;text-align:center;font:700 22px/1.1 var(--titulo);border:1px solid var(--line);background:var(--card);border-radius:8px;padding:2px}

/* ——— Listas de competencias ——— */
.filas{display:grid;gap:2px}
.fila{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;font-size:15px}
.fila:nth-child(even){background:var(--zebra)}
.fila .v{font-weight:600;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.fila small{color:var(--sub);font-size:12px}
.fila input{margin:0;accent-color:var(--acento);width:16px;height:16px}
.fila .pe{opacity:.7}

/* ——— Rasgos ——— */
.rasgos{display:grid;gap:8px}
.rasgo{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.rasgo:last-child{border-bottom:0}
.rasgo .nv{background:var(--acento);color:#fff;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rasgo .nv.raza{background:var(--chip);color:var(--text)}
.rasgo p{margin:2px 0 0;color:var(--sub);font-size:14px}
.extras{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.extras span{background:var(--campo);border-radius:999px;padding:5px 12px;font-size:13px}
.extras b{font-weight:600}

/* ——— Conjuros ——— */
.espacios{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.espacio{background:var(--campo);border-radius:12px;padding:8px 10px;min-width:74px;text-align:center}
.espacio span{display:block;font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.espacio .puntos{display:flex;gap:4px;justify-content:center;margin-top:5px;flex-wrap:wrap}
.espacio input{margin:0;accent-color:var(--acento);width:15px;height:15px}
.espacio input.num{width:44px;height:auto;text-align:center;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.buscador{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;margin:8px 0}
.resultados{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--campo)}
.resultados button{display:flex;width:100%;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:7px 12px;cursor:pointer;font-size:14px}
.resultados button:hover{background:var(--chip)}
.resultados small,.conj small{color:var(--sub)}
.conj{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.conj .quitar{border:0;background:none;color:var(--sub);cursor:pointer;font-size:18px;line-height:1}
.conj input{accent-color:var(--acento)}
.grupo-niv{margin:12px 0 2px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.monedas{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}

/* ——— Personajes: lista, asistente y ficha ——— */
.eyebrow{margin:0 0 8px;color:var(--acento);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.aviso-flot{max-width:1240px;margin:8px auto 0;padding:0 clamp(16px,4vw,40px);color:var(--aviso);font-size:13px}
.aviso-flot:empty{display:none}
#v-lista[hidden],#v-ficha[hidden]{display:none!important}
.lista-cab{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding:32px 0 22px}
.lista-cab h1{margin:0;font-family:var(--titulo);font-size:clamp(32px,5vw,48px);letter-spacing:-.03em;line-height:1.05}
.acc-lista{display:flex;flex-wrap:wrap;gap:8px}
.rejilla-pj{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:16px;padding-bottom:40px}
.tarj-pj{background:var(--card);border-radius:20px;box-shadow:var(--shadow);border-top:3px solid var(--acento);padding:18px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tarj-pj h3{margin:0;font-family:var(--titulo);font-size:22px;letter-spacing:-.01em}
.tarj-pj p{margin:0;color:var(--sub);font-size:14px}
.tarj-pj .acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tarj-pj .acc .btn{font-size:13px;padding:6px 11px}
.vacio{grid-column:1/-1;padding:40px 0;color:var(--sub);text-align:center}
.barra-hoja{display:flex;flex-wrap:wrap;gap:8px;padding-top:24px}
#v-ficha{padding-bottom:24px}
.pasos{position:sticky;top:52px;z-index:10;display:flex;gap:6px;overflow-x:auto;padding:12px 0;margin:12px 0 4px;background:var(--bg);scrollbar-width:none}
.pasos::-webkit-scrollbar{display:none}
.pasos button{flex:none;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--chip);padding:6px 14px 6px 6px;font-size:14px;cursor:pointer;white-space:nowrap}
.pasos button .n{width:24px;height:24px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700}
.pasos button.hecho .n{background:var(--acento);color:#fff}
.pasos button[aria-current="step"]{background:var(--text);color:var(--bg)}
.pasos button[aria-current="step"] .n{background:var(--bg);color:var(--text)}
.pasos button:disabled{opacity:.4;cursor:default}
.pie-paso{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.pie-paso .der-pie{display:flex;gap:8px;flex-wrap:wrap}
body.asistente .hoja{display:block;max-width:880px;margin:0 auto}
body.asistente .hoja>.panel{width:100%;margin-bottom:18px}
body.asistente #hoja [data-paso]:not(.activo){display:none!important}

/* ——— Banners, bandejas y rasgos ——— */
.banners{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:12px;margin:6px 0 12px}
.grupo-b{margin:10px 0;border-top:1px solid var(--line);padding-top:8px}
.grupo-b>summary{cursor:pointer;list-style:none;padding:4px 0}
.grupo-b>summary::-webkit-details-marker{display:none}
.grupo-b>summary h3{display:inline;margin:0;font-family:var(--titulo);font-size:20px}
.banner{background:var(--campo);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.banner.sel{border-color:var(--acento);box-shadow:0 0 0 2px color-mix(in srgb,var(--acento) 35%,transparent)}
.banner h3{margin:0;font-size:17px}
.banner p{margin:0;color:var(--sub);font-size:13px}
.banner>.btn{align-self:flex-start;font-size:13px;padding:6px 12px}
.bandeja summary{cursor:pointer;color:var(--acento);font-weight:600;font-size:14px;padding:4px 0}
.bandeja-cuerpo{white-space:pre-line;font-size:14px;line-height:1.5;padding-top:6px;color:var(--text)}
.sub-tit{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.tag-eleccion{display:inline-block;background:var(--acento);color:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.rasgo .desc{white-space:pre-line;color:var(--sub);font-size:14px;margin:4px 0 0}

/* ——— Responsive ——— */
@media (max-width:980px){.p4,.p6,.p8{grid-column:span 12}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:18px}
  .lista{position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
  .lista h2{width:100%}
  .lista .pj{width:auto;background:var(--chip)}
  .lista .acciones{margin:0;width:100%}
}
@media (max-width:640px){
  .cars{grid-template-columns:repeat(3,minmax(0,1fr))}
  .barra .titulo,.barra .sep{display:none}
  .barra .der{gap:6px}
  .monedas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .buscador{grid-template-columns:minmax(0,1fr) auto}
  .buscador .btn{grid-column:1/-1}
}

/* ——— Impresión: solo la hoja ——— */
@media print{
  .barra,.lista,.metodos,.no-print,.buscador,.resultados,.conj .quitar,.paso button{display:none!important}
  body,html{background:#fff;color:#000}
  .app{display:block;padding:0}
  .panel{box-shadow:none;border:1px solid #bbb;break-inside:avoid;margin-bottom:10px}
  input,select,textarea{border:0!important;background:none!important;appearance:none;-webkit-appearance:none}
  .car,.stat,.espacio,.extras span{background:#f2f2f2}
}
.ico{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
.grupo-b summary small{color:var(--sub);font-weight:400;font-size:.75em}
</style>
</head>
<body>
<nav class="barra">
  <div class="wrap">
    <a href="index.html"><strong>Compendio</strong></a>
    <span class="sep">›</span>
    <a class="titulo" href="#/">Personajes</a>
    <div class="der">
      <button class="btn no-print" id="imprimir" type="button">Imprimir</button>
      <button class="tema no-print" id="tema" type="button"></button>
    </div>
  </div>
</nav>
<p class="aviso-flot no-print" id="aviso-guardado"></p>

<div class="wrap">
  <section id="v-lista" hidden>
    <header class="lista-cab">
      <div>
        <p class="eyebrow">Compendio · Personajes</p>
        <h1>Personajes</h1>
      </div>
      <div class="acc-lista">
        <button class="btn prim" type="button" data-acc="crear">+ Crear personaje</button>
        <button class="btn" type="button" data-acc="importar">Importar</button>
        <button class="btn" type="button" data-acc="exportar">Exportar</button>
      </div>
    </header>
    <div class="rejilla-pj" id="rejilla-pj"></div>
    <input type="file" id="archivo" accept="application/json,.json" hidden>
  </section>

  <section id="v-ficha" hidden>
    <div class="barra-hoja no-print" id="barra-hoja">
      <button class="btn" type="button" data-acc="volver">← Personajes</button>
      <button class="btn" type="button" data-acc="editar">Editar con el asistente</button>
    </div>
    <nav class="pasos no-print" id="pasos" aria-label="Pasos de la ficha"></nav>

    <main class="hoja" id="hoja">
      <section class="panel" id="p-id">
        <div class="cabecera">
          <input class="nombre" id="f-nombre" data-k="nombre" placeholder="Nombre del personaje" aria-label="Nombre del personaje">
          <span class="resumen" id="resumen"></span>
        </div>
      </section>

      <section class="panel p6" data-paso="1" id="p-raza">
        <h2>Raza</h2>
        <div class="campos">
          <label class="campo" hidden>Raza<select id="f-raza" data-k="raza" data-r="1"></select></label>
          <label class="campo" id="l-subraza">Subraza<select id="f-subraza" data-k="subraza" data-r="1"></select></label>
        </div>
        <div class="banners" id="b-raza"></div>
        <p class="nota">Sus rasgos aparecen en el paso 7. Las mejoras de característica que elijas están en el paso 3.</p>
      </section>

      <section class="panel p6" data-paso="2" id="p-clase">
        <h2>Clase</h2>
        <div class="campos">
          <label class="campo" hidden>Clase<select id="f-clase" data-k="clase" data-r="1"></select></label>
          <label class="campo" id="l-sub">Subclase<span id="c-subclase" style="display:contents"></span></label>
          <label class="campo">Nivel<select id="f-nivel" data-k="nivel" data-r="1"></select></label>
        </div>
        <div id="b-clase"></div>

<script>
/* ——— Constantes ——— */
const CARS=['FUE','DES','CON','INT','SAB','CAR'];
const NOMBRE_CAR={FUE:'Fuerza',DES:'Destreza',CON:'Constitución',INT:'Inteligencia',SAB:'Sabiduría',CAR:'Carisma'};
const HABILIDADES=[['Acrobacias','DES'],['Arcanos','INT'],['Atletismo','FUE'],['Engaño','CAR'],['Historia','INT'],['Interpretación','CAR'],
  ['Intimidación','CAR'],['Investigación','INT'],['Juego de manos','DES'],['Medicina','SAB'],['Naturaleza','INT'],['Percepción','SAB'],
  ['Perspicacia','SAB'],['Persuasión','CAR'],['Religión','INT'],['Sigilo','DES'],['Supervivencia','SAB'],['Trato con animales','SAB']];
const COSTE={8:0,9:1,10:2,11:3,12:4,13:5,14:7,15:9};
const ARRAY=[15,14,13,12,10,8];
const MAG=['Sin magia','Sobrenatural','Semilanzador','Lanzador'];
const CLAVE='compendio-fichas';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mod=v=>Math.floor((v-10)/2);
const signo=n=>(n>=0?'+':'')+n;
const competencia=nv=>2+Math.floor((nv-1)/4);
const volOf=id=>VOL.find(v=>v.id===id);

/* ——— Clases homebrew: perfil sacado del texto del compendio ——— */
const ABREV=[['FUE',/\bfuerza\b/i,/\bFUE\b/],['DES',/\bdestreza\b/i,/\bDES\b/],['CON',/\bconstituci[oó]n\b/i,/\bCON\b/],
  ['INT',/\binteligencia\b/i,/\bINT\b/],['SAB',/\bsabidur[ií]a\b/i,/\bSAB\b/],['CAR',/\bcarisma\b/i,/\bCAR\b/]];
/* Características nombradas en un fragmento, en el orden en que aparecen */
function carsEn(t){
  return ABREV.map(([k,a,b])=>{const m=[t.match(a),t.match(b)].filter(Boolean).map(x=>x.index);return [k,m.length?Math.min(...m):-1];})
    .filter(([,i])=>i>=0).sort((a,b)=>a[1]-b[1]).map(([k])=>k);
}
const CORTE=/\s(?=(?:Armaduras?|Armas|Herramientas|Habilidades|Equipo|Recurso|Rol en grupo|Dado de golpe|Stat principal|Característica|Atributo|Subclase|Arquetipo|Conjuros clave|Tiradas)\b)/;
function valor(texto,re){
  const m=texto.match(re);if(!m)return '';
  /* Quita el «:» antes de cortar («Armas: Armas simples…») y se queda con la primera frase */
  return m[1].replace(/^\s*[:·—-]\s*/,'').split(CORTE)[0].split(/\.\s/)[0].trim().slice(0,160);
}
const textoPlano=html=>html.replace(/<br\s*\/?>|<\/(p|div|li|tr|td|th|h\d|dt|dd)>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ');

const perfiles={};
function perfilHomebrew(c){
  if(perfiles[c.f])return perfiles[c.f];
  const texto=c.secciones.map(s=>textoPlano(s.html)).join(' ');
  const sal=valor(texto,/\b(?:Salvaciones|Tiradas de [Ss]alvaci[oó]n|Tiradas de sal\.)\s*(.{0,90})/);
  const conj=valor(texto,/\b(?:Caracter[ií]stica de (?:conjuraci[oó]n|lanzamiento)|Atributo de lanzamiento|Aptitud (?:m[aá]gica|de lanzamiento)|Conjuros clave)\s*(.{0,40})/i);
  /* Tabla de progresión: la que tenga más filas cuyo primer dato sea un nivel */
  let tabla=null;
  const doc=new DOMParser().parseFromString(c.secciones.map(s=>s.html).join(''),'text/html');
  /* Texto de celda: etiquetas contiguas (<span>Rasgo</span><span>Otro</span>) separadas por comas */
  const celda=td=>{const t=document.createElement('div');t.innerHTML=td.innerHTML.replace(/<\/(span|div|li|p|a)>\s*<(span|div|li|p|a)\b/gi,'</$1>, <$2');return t.textContent.replace(/\s+/g,' ').trim();};
  doc.querySelectorAll('table').forEach(t=>{
    const filas=[...t.querySelectorAll('tr')].filter(tr=>tr.querySelector('td'));
    const datos=filas.map(tr=>[...tr.children].map(celda))
      .filter(r=>/^\d{1,2}\b/.test(r[0])).map(r=>({nv:parseInt(r[0]),c:r}));
    const niveles=new Set(datos.map(d=>d.nv)).size;
    if(niveles>=10&&(!tabla||niveles>tabla.niveles)){
      /* Cabecera: la del <thead> o, si no hay, la primera fila hecha de <th> */
      const filaCab=t.querySelector('thead tr')||[...t.querySelectorAll('tr')].find(tr=>tr.querySelector('th')&&!tr.querySelector('td'));
      let cab=filaCab?[...filaCab.children].map(celda):[];
      if(!cab.length)cab=datos[0].c.map((_,i)=>'Col '+(i+1));
      tabla={niveles,cab,datos};
    }
  });
  let rasgosCol=-1,espCols=[],trucosCol=-1,extrasCols=[];
  if(tabla){
    tabla.cab.forEach((h,i)=>{
      if(i===0)return;
      const m=h.match(/^(?:espacios\s*)?([1-9])\s*\.?\s*[º°o]?$/i);
      if(m)espCols.push([+m[1],i]);
      else if(/truco|menor/i.test(h))trucosCol=i;
      else if(rasgosCol<0&&/rasgo|caracter[ií]stica|habilidad|aptitud|beneficio/i.test(h))rasgosCol=i;
      else if(!/^(bon|comp|prof|b\.?\s*prof|bop|bc)/i.test(h))extrasCols.push(i);
    });
    if(rasgosCol<0)rasgosCol=tabla.cab.length-1;
    extrasCols=extrasCols.filter(i=>i!==rasgosCol);
  }
  const p0={sal:carsEn(sal).slice(0,2),salTexto:sal,
    arm:valor(texto,/\bArmaduras?\s*(.{0,120})/),armas:valor(texto,/\bArmas\s*(.{0,140})/),
    herr:valor(texto,/\bHerramientas\s*(.{0,100})/),hab:habTxt(texto),
    car:carsEn(conj)[0]||'',tabla,rasgosCol,espCols,trucosCol,extrasCols};
  p0.bl=bloquesHB(c);p0.subs=subsDe(c,p0.bl);p0.feat=featHB(p0);p0.lore=loreHB(c,p0.bl);p0.como=comoHB(c,p0.bl);return perfiles[c.f]=p0;
}
const filaNivel=(p,nv)=>p.tabla&&[...p.tabla.datos].reverse().find(d=>d.nv<=nv);

/* ——— Texto del compendio: títulos, subclases, rasgos y textos de presentación ——— */
const sinAcento=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const textoEl=e=>e.textContent.replace(/\s+/g,' ').trim();
const SUB_TITULO=/subclas|senda|arquetipo|escuela|via|tradicion|linaje|orden|ajah|camino|faceta|dominio|vocacion|motivacion|rumbo|circulo|colegio|herencia|especialidad|voz|resonancia/;
const NUM_PAL={uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6};
const ELECCION=/\b(elig(e|es|ir)|elegir|escoge|escoger)\b/i;

function limpiarNombre(t){
  return String(t).replace(/\s*\(detalle completo\)/i,'').replace(/^⚔️\s*/,'').replace(/^⚓\s*/,'')
    .replace(/^(nivel|nv\.?)\s*\d+\s*[—–\-:]?\s*/i,'')
    .replace(/\s*\((nivel|nv\.?)\s*\d+\)\s*$/i,'')
    .replace(/\s*[·—–-]\s*(nivel|nv\.?)\s*\d+.*$/i,'')
    .replace(/\s+(nivel|nv\.?)\s*\d+\s*$/i,'')
    .trim();
}
/* Elementos de texto de una sección, en orden, sin tablas ni etiquetas de bloque */
function itemsDe(html){
  const raiz=document.createElement('div');raiz.innerHTML=html;
  return [...raiz.querySelectorAll('h2,h3,h4,h5,h6,p,li,dd')].filter(e=>!e.closest('table,.bloque')&&textoEl(e));
}
/* Texto que sigue a un título, hasta el siguiente título del mismo nivel o superior */
function descDe(items,idx){
  const lv=/^H\d$/.test(items[idx].tagName)?+items[idx].tagName[1]:9,out=[];
  for(let k=idx+1;k<items.length&&out.join('\n').length<900;k++){
    const e=items[k],t=textoEl(e);
    if(/^H\d$/.test(e.tagName)){if(+e.tagName[1]<=lv)break;out.push('▸ '+t);}
    else out.push(e.tagName==='LI'?'• '+t:t);
  }
  return out.join('\n').slice(0,900);
}
function textoSec(sec,max){
  return sec.items.filter(e=>e.tagName==='P'||e.tagName==='LI').map(e=>(e.tagName==='LI'?'• ':'')+textoEl(e)).join('\n').slice(0,max);
}
function bloquesHB(c){return c.secciones.map(s=>({t:s.t,tipo:s.tipo,items:itemsDe(s.html)}));}

/* Subclases fijadas a mano para las clases cuyo texto no sigue el patrón. Vacío = sin subclases. */
const SUB_MANUAL={
  Ladron_de_Almas:[],El_Juez:[],El_Dhampiro:[],El_Alomante:[],El_Corredor_del_Viento:[],El_Portador_de_la_Marca:[],El_Plagado:[],
  El_Cazador_de_la_Noche:[{n:'Cainhurst',nivel:3},{n:'Iglesia de la Sanación',nivel:3}],
  El_Tahur:[{n:'Escuela del Duelo',nivel:3},{n:'Escuela de la Calle',nivel:3}],
  El_Sonador_de_Mensis:[{n:'La Nodriza',nivel:3},{n:'El Informe',nivel:3}],
  El_Exorcista_de_las_Cenizas:[{n:'Juramento del Cazador de Brujos',nivel:3},{n:'Juramento del Linaje Maldito',nivel:3}],
  El_Caminante_de_los_Suenos:[{n:'Senda del Hacha',nivel:14,sec:'El Hacha o el Martillo'},{n:'Senda del Martillo',nivel:14,sec:'El Hacha o el Martillo'}],
  Restriccion_Celestial:[{n:'Ejecutor de Sombra',nivel:3},{n:'Lanza Inamovible',nivel:3}],
  El_Heroe:['Gloria','Sed de Batalla','Presencia Aterradora','Heridas que Honran','Sin Cuartel','Último Campeón','Nostos','Resistencia del Regresante','Ingenio del Superviviente','No Hoy'].map(n=>({n,nivel:1})),
  Herrero_de_Guerra:['Forja Viva','Espíritu de la Forja','Martillo de Herrero','Forja Acelerada','Armadura Fundida','Corazón de Magma'].map(n=>({n,nivel:3})),
  El_Oficiante:[{n:'Cadena Consagrada',nivel:3},{n:'Fuego Judicial',nivel:7},{n:'Yugo Eterno',nivel:13},{n:'Verdugo de lo Profano',nivel:17},{n:'Sello de Umbral',nivel:3},{n:'Exilio Rápido',nivel:7}],
  El_Portador_de_la_Mancha:[{n:'Orden del Filo',nivel:3,sec:'Orden del Filo'},{n:'Orden de la Runa',nivel:3,sec:'Orden de la Runa'},{n:'Orden del Susurro',nivel:3,sec:'Orden del Susurro'}],
  El_Tejedor_del_Poder:[{n:'Ajah Verde',nivel:14},{n:'Ajah Gris',nivel:14}],
  El_Tejedor_de_la_Llama:[{n:'Balefire',nivel:14},{n:'Corazón de la Tierra',nivel:14}],
  El_Guardian:[{n:'Escudo del Vínculo',nivel:14},{n:'Filo del Vínculo',nivel:14}],
  El_Recordado:[{n:'Atado al Cuerno',nivel:14},{n:'El General',nivel:14}],
  La_Portadora_de_Glifos:[{n:'Orden de Ecclesia',nivel:3},{n:'El Tirador de Agartha',nivel:3},{n:'Sombra de Dominus',nivel:3}]
};
/* Subclases: títulos h3/h4 dentro de secciones con nombre de subclase; sin los títulos de rasgo (Nivel, Nv., Pasiva…) */
function subclasesHB(bl){
  const out=[],vistos=new Set();
  bl.forEach(sec=>{
    if(!(sec.tipo==='subclases'||SUB_TITULO.test(sinAcento(sec.t))))return;
    const nivelSec=+((sec.t.match(/nivel\s*(\d+)/i)||[])[1])||3;
    sec.items.forEach((e,i)=>{
      if(!/^H[34]$/.test(e.tagName))return;
      const raw=textoEl(e),n=limpiarNombre(raw);
      if(!n||n.length>60)return;
      if(/^(nivel|nv)\s*\d/i.test(raw)||/\((nivel|nv)/i.test(raw)||/\bnv\.?\s*\d/i.test(raw))return;
      if(/\b(pasiva|accion|reaccion|bonus|bonificada|por descanso|una vez)\b/.test(sinAcento(raw)))return;
      if(vistos.has(sinAcento(n)))return;vistos.add(sinAcento(n));
      out.push({n,nivel:nivelSec,d:descDe(sec.items,i)});
    });
  });
  return out;
}
/* Subclases de una clase: la lista fijada a mano si la hay, si no la detección automática */
function subsDe(c,bl){
  const m=SUB_MANUAL[c.f];
  if(!m)return subclasesHB(bl);
  return m.map(e=>{
    const sec=e.sec?bl.find(s=>s.t===e.sec):null;
    let d=sec?textoSec(sec,900):'';
    if(!sec){
      const b=sinAcento(e.n);
      search:for(const s of bl)for(let i=0;i<s.items.length;i++){
        const it=s.items[i];if(!/^H[2-6]$/.test(it.tagName))continue;
        if(sinAcento(textoEl(it)).includes(b)){d=descDe(s.items,i);break search;}
      }
    }
    return {n:e.n,nivel:e.nivel||3,d};
  });
}
/* Texto de habilidades con su cuenta («elige 3») y la lista, sin lo que venga después */
function habTxt(texto){
  /* Puede haber varias menciones («Habilidades Primarias…»): gana la que más nombres de habilidad trae */
  let mejor='',mejorN=-1;
  for(let i=texto.indexOf('Habilidades');i>=0;i=texto.indexOf('Habilidades',i+1)){
    const m=texto.slice(i+11,i+211).match(/^(\s*\([^)]*\))?\s*:?\s*(.*)$/);
    if(!m)continue;
    const cand=((m[1]||'').trim()+' '+m[2].split(CORTE)[0].split(/\.\s/)[0]).trim();
    const n=HABILIDADES.filter(h=>sinAcento(cand).includes(sinAcento(h[0]))).length;
    if(n>mejorN){mejorN=n;mejor=cand;}
  }
  return mejor;
}
function splitRasgos(t){return String(t).split(/,\s*(?![^()]*\))/).map(s=>s.trim()).filter(s=>s&&!/^[—–-]$/.test(s));}
/* Descripción de un rasgo de la tabla: el título con ese nombre (con o sin etiqueta de acción) */
function descRasgo(bl,nombre){
  const n=sinAcento(limpiarNombre(nombre).replace(/\s*\(.*?\)/g,'').trim());
  if(!n)return '';
  for(const sec of bl)for(let i=0;i<sec.items.length;i++){
    const e=sec.items[i];if(!/^H[2-6]$/.test(e.tagName))continue;
    const h=sinAcento(limpiarNombre(textoEl(e)).replace(/\s*\(.*?\)/g,'').trim());
    if(h===n||h.startsWith(n+' '))return descDe(sec.items,i);
  }
  return '';
}
function featHB(p){
  if(!p.tabla)return [];
  const out=[];
  p.tabla.datos.forEach(d=>splitRasgos(d.c[p.rasgosCol]||'').forEach(n=>out.push({nv:d.nv,n,d:descRasgo(p.bl,n)})));
  return out;
}
function loreHB(c,bl){return [c.g,bl[0]?textoSec(bl[0],700):''].filter(Boolean).join('\n\n');}
function comoHB(c,bl){
  const sec=bl.find(s=>/recurso|cilindro|tambor|resonancia|pip|dados|mecanica|reglas/.test(sinAcento(s.t)))||bl[1];
  return [c.rec?'Recurso: '+c.rec+'.':'',sec?textoSec(sec,700):''].filter(Boolean).join('\n\n');
}
/* Habilidades que la clase deja elegir, y cuántas. Sin lista concreta, se pueden elegir todas. */
function habInfo(c){
  if(!c)return {n:0,lista:null};
  if(c.tipo==='o')return {n:c.hab?c.hab.n:0,lista:c.hab&&c.hab.de!=='todas'?c.hab.de:null};
  const t=c.habTexto||'';
  /* «elige N», «elegir N» (palabra completa: no «Religión») o «N de» / «N entre» al principio */
  const ms=[t.match(/\b(?:elig|eleg)\w*\s*(\d+|uno|una|dos|tres|cuatro|cinco|seis)?\s*(?:de|entre|:)?\s*:?\s*([^.;]+)/i),
    t.match(/^\s*(\d+|uno|una|dos|tres|cuatro)\s+(?:de|entre):?\s*([^.;]+)/i)];
  for(const m of ms){
    if(!m)continue;
    const lista=HABILIDADES.map(h=>h[0]).filter(h=>sinAcento(m[2]).includes(sinAcento(h)));
    if(lista.length&&lista.length<HABILIDADES.length)return {n:+m[1]||NUM_PAL[(m[1]||'').toLowerCase()]||2,lista};
  }
  /* Lista de habilidades sin «elige N»: se limita a esa lista, sin contar cuántas */
  const lista=HABILIDADES.map(h=>h[0]).filter(h=>sinAcento(t).includes(sinAcento(h)));
  if(lista.length>=2&&lista.length<HABILIDADES.length)return {n:0,lista};
  return {n:0,lista:null};
}


/* ——— Vista común de una clase (oficial u homebrew) ——— */
function claseDe(id){
  if(!id)return null;
  const [t,k]=id.split(':');
  if(t==='o'){
    const c=CLASES_OFICIALES.find(x=>x.id===k);if(!c)return null;
    return {tipo:'o',id,lore:c.lore,como:c.como,n:c.n,d:c.d,sal:c.sal,arm:c.arm,armas:c.armas,herr:c.herr,hab:c.hab,
      subNivel:c.sub.nivel,subTitulo:c.sub.titulo,subs:c.sub.op.map(o=>o.n),
      subList:c.sub.op.map(o=>({n:o.n,nivel:o.nivel||c.sub.nivel,src:LIBROS[o.src||'phb14'].n,
        d:[o.e,...o.r.map(([nv,nm,t])=>'Nv '+nv+': '+nm+(t?' — '+t:''))].filter(Boolean).join('\n')})),
      rasgos(nv,sub){
        const so=c.sub.op.find(o=>o.n===sub);
        const base=c.rasgos.filter(r=>r[0]<=nv).map(([n,a,b])=>({nv:n,n:a,t:b}));
        const deSub=so?so.r.filter(r=>r[0]<=nv).map(([n,a,t])=>({nv:n,n:a,t:t?so.n+': '+t:so.n})):[];
        return [...base,...deSub].sort((a,b)=>a.nv-b.nv);
      },
      extras:nv=>Object.entries(c.extras||{}).map(([k,v])=>[k,v[nv-1]]).filter(([,v])=>v&&v!=='0'&&v!==0),
      magia(nv,sub){
        const so=c.sub.op.find(o=>o.n===sub);
        const m=c.magia||(so&&so.magia);if(!m)return null;
        return magiaOficial(m,nv);
      }};
  }
  const c=CLASES.find(x=>x.f===k);if(!c)return null;
  const p=perfilHomebrew(c);
  return {tipo:'h',id,n:c.n,d:c.d,sal:p.sal,arm:p.arm,armas:p.armas,herr:p.herr,hab:null,habTexto:p.hab,vol:c.v,f:c.f,rec:c.rec,m:c.m,p,
    lore:p.lore,como:p.como,subTitulo:'Subclase',subNivel:3,subList:p.subs,subs:p.subs.map(s=>s.n),
    rasgos(nv,sub){
      const base=p.feat.filter(f=>f.nv<=nv).map(f=>({nv:f.nv,n:f.n,t:f.d}));
      const s=p.subs.find(x=>x.n===sub);
      if(s&&nv>=s.nivel)base.push({nv:s.nivel,n:'Subclase: '+s.n,t:s.d});
      return base.sort((a,b)=>a.nv-b.nv);
    },
    extras(nv){
      const f=filaNivel(p,nv);if(!f)return [];
      return p.extrasCols.map(i=>[p.tabla.cab[i],f.c[i]]).filter(([k,v])=>k&&v&&!/^[—–-]$/.test(v));
    },
    magia(nv,sub,ficha){
      if(c.m<2&&!p.espCols.length)return null;
      const f=filaNivel(p,nv);
      let esp=[];
      if(p.espCols.length&&f)p.espCols.forEach(([n,i])=>{const v=parseInt(f.c[i]);if(v>0)esp[n-1]=v;});
      else esp=espaciosTipo(c.m===3?'completo':'medio',nv);
      for(let i=0;i<esp.length;i++)esp[i]=esp[i]||0;
      const trucos=p.trucosCol>=0&&f?parseInt(f.c[p.trucosCol])||0:null;
      return {car:p.car,lista:'*',esp,trucos,deTabla:!!p.espCols.length};
    }};
}
function espaciosTipo(tipo,nv){
  const n=tipo==='completo'?nv:tipo==='medio'?(nv<2?0:Math.ceil(nv/2)):tipo==='artifice'?Math.ceil(nv/2):tipo==='tercio'?(nv<3?0:Math.ceil(nv/3)):0;
  return n?[...ESPACIOS_COMPLETO[n-1]]:[];
}
function magiaOficial(m,nv){
  const r={car:m.car,lista:m.lista,trucos:m.trucos[nv-1]||0,tipo:m.tipo};
  if(m.tipo==='pacto'){
    r.pacto={n:nv>=17?4:nv>=11?3:nv>=2?2:1,niv:Math.min(5,Math.ceil(nv/2))};
    r.arcanum=[[11,6],[13,7],[15,8],[17,9]].filter(([n])=>nv>=n).map(([,l])=>l);
    r.esp=[];
  }else r.esp=espaciosTipo(m.tipo,nv);
  if(m.conocidos)r.conocidos=m.conocidos[nv-1];
  if(m.preparados)r.preparados=m.preparados;
  /* Paladín y explorador a nivel 1, o caballero arcano antes del 3: aún no lanzan */
  if(!r.pacto&&!r.esp.length&&!r.trucos)return null;
  return r;
}

const PASOS=['Raza','Clase','Características','Habilidades','Conjuros','Detalles','Resumen'];
function pasoValido(n){return n!==5||!$('p-conj').hidden;}
function siguientePaso(p,dir){let n=p+dir;while(n>=1&&n<=7&&!pasoValido(n))n+=dir;return n;}
function ir(h){if(location.hash===h)ruta();else location.hash=h;}
function pintarPasos(){
  const enFicha=vista==='hoja';
  $('pasos').innerHTML=PASOS.map((nombre,i)=>{
    const k=i+1,na=k===5&&$('p-conj').hidden;
    if(enFicha&&na)return '';
    const hecho=!enFicha&&k<paso&&!na,actual=!enFicha&&k===paso;
    return `<button type="button" data-s="${k}"${actual?' aria-current="step"':''}${hecho?' class="hecho"':''}${na&&!enFicha?' disabled title="Esta clase no lanza conjuros"':''}><span class="n">${hecho?'✓':k}</span>${nombre}</button>`;
  }).join('');
}
function mostrar(){
  $('v-lista').hidden=vista!=='lista';
  $('v-ficha').hidden=vista==='lista';
  $('barra-hoja').hidden=vista!=='hoja';
  $('pie-paso').hidden=vista!=='asistente';
  document.body.classList.toggle('asistente',vista==='asistente');
  document.querySelectorAll('#hoja [data-paso]').forEach(el=>el.classList.toggle('activo',+el.dataset.paso===paso));
  if(vista==='asistente'){
    const ant=siguientePaso(paso,-1),sig=siguientePaso(paso,1);
    $('btn-atras').textContent=ant<1?'← Personajes':'← '+PASOS[ant-1];
    $('btn-sig').textContent=paso===7?'Ver ficha ✓':'Siguiente: '+PASOS[sig-1]+' →';
  }
  pintarPasos();
  document.title=(vista==='lista'?'Personajes':((F&&F.nombre)||'Nuevo personaje')+' · Personajes');
  window.scrollTo(0,0);
}
function ruta(){
  const h=decodeURIComponent(location.hash);
  let m;
  if((m=h.match(/^#clase=(.+)$/))){
    /* Enlace desde el compendio: personaje nuevo con esa clase, en el paso 2 */
    const id=m[1].includes(':')?m[1]:'h:'+m[1];
    if(claseDe(id)){borrador=fichaNueva(id);location.replace('#/nuevo/2');}
    else location.replace('#/');
    return;
  }
  if((m=h.match(/^#\/pj\/([^/]+)$/))){
    if(!datos.lista.some(x=>x.id===m[1])){location.replace('#/');return;}
    vista='hoja';abrir(m[1]);
  }else if((m=h.match(/^#\/nuevo(?:\/(\d))?$/))){
    if(!borrador)borrador=fichaNueva();
    F=borrador;datos.activa=F.id;
    vista='asistente';paso=Math.min(7,Math.max(1,+(m[1]||1)));
    pintar();
    if(!pasoValido(paso))paso=siguientePaso(paso,-1);
  }else{
    vista='lista';pintarLista();
  }
  if(vista!=='lista')pintar();
  mostrar();
}

  ${c?`<p class="nota"><b>Armaduras:</b> ${esc(c.arm||'—')}<br><b>Armas:</b> ${esc(c.armas||'—')}${c.herr&&c.herr!=='—'?`<br><b>Herramientas:</b> ${esc(c.herr)}`:''}${raza().r&&(raza().r.comp||(raza().s&&raza().s.comp))?`<br><b>Por la raza:</b> ${esc([raza().r.comp,raza().s&&raza().s.comp].filter(Boolean).join(' '))}`:''}<br><b>Idiomas:</b> ${esc(r?r.idiomas:'')}</p>`:''}`;
}

function habilidadesFijas(){const {r,s}=raza();return [...((r&&r.hab)||[]),...((s&&s.hab)||[])];}
function bonoHab(n,t,pb){
  const car=HABILIDADES.find(h=>h[0]===n)[1];
  const nivel=habilidadesFijas().includes(n)?Math.max(1,F.hab[n]||0):(F.hab[n]||0);
  return mod(t[car])+nivel*pb;
}

/* ——— Rasgos hasta el nivel elegido, con lo que hace cada uno ——— */
function filaRasgo(nombre,texto,etiqueta,cls){
  const tag=texto&&ELECCION.test(texto)?'<span class="tag-eleccion">Elección</span>':'';
  return `<div class="rasgo"><span class="nv${cls?' '+cls:''}">${esc(etiqueta)}</span><div><b>${esc(nombre)}</b>${tag}${texto?`<p class="desc">${esc(texto)}</p>`:''}</div></div>`;
}
function pintarRasgos(){
  const c=claseDe(F.clase),{r,s}=raza();

  if(ex.length)h+=`<div class="extras">${ex.map(([k,v])=>`<span>${esc(k)}: <b>${esc(v)}</b></span>`).join('')}</div>`;

    if(c.tipo==='h'&&!c.p.tabla)filas.push(`<p class="nota">Esta clase no tiene una tabla de niveles que se pueda leer. <a href="index.html#/clase/${esc(c.f)}">Consulta sus rasgos en el compendio →</a></p>`);
    else if(c.tipo==='h')filas.push(`<p class="nota">Rasgos hasta el nivel ${F.nivel}. <a href="index.html#/clase/${esc(c.f)}">Texto completo en el compendio →</a></p>`);

/* ——— Conjuros ——— */
function magiaActual(){const c=claseDe(F.clase);return c?c.magia(F.nivel,F.subclase,F):null;}
function nivelMaxConj(m){
  if(!m)return -1;
  let n=0;
  const esp=espaciosEfectivos(m);
  esp.forEach((v,i)=>{if(v>0)n=i+1;});
  if(m.pacto)n=Math.max(n,m.pacto.niv,...(m.arcanum||[]));
  return n;
}
function espaciosEfectivos(m){
  const e=[...(m.esp||[])];
  Object.entries(F.espManual||{}).forEach(([k,v])=>{if(v!==''&&v!=null)e[k-1]=+v;});
  for(let i=0;i<e.length;i++)e[i]=e[i]||0;
  return e;
}
function pintarConjuros(){
  const m=magiaActual(),c=claseDe(F.clase);
  const tieneLista=F.conjuros.length>0;
  $('p-conj').hidden=!m&&!tieneLista;
  if($('p-conj').hidden)return;
  const t=totales(),pb=competencia(F.nivel);
  const car=(m&&m.car)||F.carConj;
  let h='';
  if(m){
    h+='<div class="stats" style="margin-bottom:12px">';
    h+=`<div class="stat">${m.car?`<b>${m.car}</b>`:`<select class="entrada" data-k="carConj" data-r="1" aria-label="Característica de conjuración"><option value="">?</option>${CARS.map(k=>`<option ${F.carConj===k?'selected':''}>${k}</option>`).join('')}</select>`}<span>Característica</span></div>`;
    if(car){h+=`<div class="stat"><b>${8+pb+mod(t[car])}</b><span>CD de salvación</span></div><div class="stat"><b>${signo(pb+mod(t[car]))}</b><span>Ataque de conjuro</span></div>`;}
    if(m.trucos)h+=`<div class="stat"><b>${m.trucos}</b><span>Trucos</span></div>`;
    if(m.conocidos)h+=`<div class="stat"><b>${m.conocidos}</b><span>Conjuros conocidos</span></div>`;
    if(m.preparados&&car){const n=Math.max(1,mod(t[car])+(m.preparados==='mitad'?Math.floor(F.nivel/2):F.nivel));h+=`<div class="stat"><b>${n}</b><span>Preparados</span></div>`;}
    h+='</div>';
    const esp=espaciosEfectivos(m);
    const niveles=Math.max(esp.length,c&&c.tipo==='h'?Math.max(1,esp.length):0);
    if(m.pacto){
      const u=F.usados.pacto||0;
      h+=`<div class="espacios"><div class="espacio"><span>Pacto · nivel ${m.pacto.niv}</span><div class="puntos">${Array.from({length:m.pacto.n},(_,i)=>`<input type="checkbox" data-uso="pacto" data-i="${i}" ${i<u?'checked':''} aria-label="Espacio de pacto ${i+1} gastado">`).join('')}</div></div>${(m.arcanum||[]).map(l=>`<div class="espacio"><span>Arcanum ${l}</span><div class="puntos"><input type="checkbox" data-uso="arc${l}" data-i="0" ${(F.usados['arc'+l]||0)>0?'checked':''} aria-label="Arcanum de nivel ${l} usado"></div></div>`).join('')}</div>`;
    }else if(niveles){
      h+='<div class="espacios">'+Array.from({length:c&&c.tipo==='h'?Math.max(niveles,1):niveles},(_,i)=>{
        const n=esp[i]||0,u=F.usados[i+1]||0;
        const editar=c&&c.tipo==='h'?`<input class="num no-print" type="number" min="0" max="9" data-esp="${i+1}" value="${n}" aria-label="Espacios de nivel ${i+1}">`:'';
        return `<div class="espacio"><span>Nivel ${i+1}</span><div class="puntos">${Array.from({length:n},(_,j)=>`<input type="checkbox" data-uso="${i+1}" data-i="${j}" ${j<u?'checked':''} aria-label="Espacio de nivel ${i+1} gastado">`).join('')}</div>${editar}</div>`;
      }).join('')+'</div>';
    }
    h+='<p class="nota no-print"><button class="btn" type="button" data-a="descanso">Descanso largo (recuperar espacios)</button></p>';
    if(c&&c.tipo==='h')h+=`<p class="nota">${m.deTabla?'Espacios leídos de la tabla de la clase.':`Espacios de la tabla estándar de ${CLASES.find(x=>x.f===c.f).m===3?'lanzador completo':'semilanzador'}; ajústalos si la clase usa otro sistema.`} Puedes elegir conjuros de cualquier lista o añadir los propios de la clase.</p>`;
  }
  /* Conjuros elegidos, por nivel */
  const porNiv={};
  F.conjuros.forEach((x,i)=>{const d=CONJUROS.find(s=>s.n===x.n);const nv=d?d.niv:(x.niv||0);(porNiv[nv]=porNiv[nv]||[]).push({x,d,i});});
  const nombres=Object.keys(porNiv).map(Number).sort((a,b)=>a-b);
  h+=nombres.length?nombres.map(nv=>`<div class="grupo-niv">${nv?'Nivel '+nv:'Trucos'}</div>`+porNiv[nv].map(({x,d,i})=>`<div class="conj">${nv?`<input type="checkbox" data-prep="${i}" title="Preparado" aria-label="Preparado" ${x.prep?'checked':''}>`:'<span></span>'}<span>${esc(x.n)} ${d?`<small>${ESCUELAS[d.esc]}${d.ritual?' · ritual':''}${d.conc?' · concentración':''}</small>`:'<small>propio</small>'}</span><button class="quitar" type="button" data-quitar="${i}" aria-label="Quitar ${esc(x.n)}">×</button></div>`).join('')).join('')
    :'<p class="nota">Aún no hay conjuros. Búscalos abajo.</p>';
  $('c-conj').innerHTML=h;
  if(c&&c.tipo==='o'&&m&&$('q-lista').dataset.clase!==c.id){$('q-lista').value=m.lista;$('q-lista').dataset.clase=c.id;}
  if(c&&c.tipo==='h'&&$('q-lista').dataset.clase!==c.id){$('q-lista').value='';$('q-lista').dataset.clase=c.id;}
  pintarResultados();
}
function pintarResultados(){
  const m=magiaActual(),max=nivelMaxConj(m);
  const q=$('q-conj').value.trim().toLowerCase(),lista=$('q-lista').value;
  const ya=new Set(F.conjuros.map(x=>x.n));
  const r=CONJUROS.filter(s=>(!lista||s.listas.includes(lista))&&(max<0||s.niv<=Math.max(max,0))&&!ya.has(s.n)
    &&(!q||s.n.toLowerCase().includes(q)||s.en.toLowerCase().includes(q)||ESCUELAS[s.esc].toLowerCase().includes(q)))
    .sort((a,b)=>a.niv-b.niv||a.n.localeCompare(b.n,'es'));
  $('resultados').innerHTML=r.slice(0,80).map(s=>`<button type="button" data-add="${esc(s.n)}"><span>${esc(s.n)} <small>${esc(s.en)}</small></span><small>${s.niv?'Nv '+s.niv:'Truco'} · ${ESCUELAS[s.esc]}</small></button>`).join('')
    +(r.length>80?`<p class="nota" style="padding:0 12px 8px">${r.length-80} más: afina la búsqueda.</p>`:'')
    +(!r.length?'<p class="nota" style="padding:8px 12px">Sin resultados.</p>':'');
}

/* ——— Eventos ——— */
const hoja=$('hoja');
hoja.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.k&&!el.dataset.r){
    const ks=el.dataset.k.split('.');let o=F;ks.slice(0,-1).forEach(k=>{o=o[k]=o[k]||{};});

  }
  if(el.dataset.man){F.base[el.dataset.man]=Math.max(1,Math.min(30,+el.value||0));guardar();pintarCombate();pintarSalHab();pintarConjuros();
    const t=totales();el.closest('.car').querySelector('.mod').textContent=signo(mod(t[el.dataset.man]));el.closest('.car').querySelector('.tot').textContent='Total '+t[el.dataset.man];}
  if(el.dataset.esp){F.espManual[el.dataset.esp]=el.value;guardar();}

});
hoja.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.r&&el.dataset.k){
    const k=el.dataset.k;
    F[k]=k==='nivel'?+el.value:el.value;
    if(k==='clase'){F.subclase='';F.sal=null;F.espManual={};F.usados={};}
    if(k==='raza'){F.subraza='';F.elegidas=[];}
    if(k==='subraza')F.elegidas=[];
    if(k==='nivel'){F.usados={};}
    cambio();return;
  }
  if(el.dataset.asig){
    const k=el.dataset.asig,v=el.value===''?null:+el.value;
    F.asig=F.asig||{};
    /* Cada valor se usa una vez: si ya estaba en otra característica, se intercambian */
    const otra=CARS.find(x=>x!==k&&F.asig[x]===v);
    if(otra!=null&&v!=null)F.asig[otra]=F.asig[k]??null;
    F.asig[k]=v;
    const vals=F.metodo==='array'?ARRAY:F.tiradas.map(x=>x.total);
    CARS.forEach(x=>F.base[x]=F.asig[x]!=null?vals[F.asig[x]]:8);
    cambio();return;
  }
  if(el.dataset.el){
    const k=el.dataset.el;
    F.elegidas=el.checked?[...F.elegidas,k]:F.elegidas.filter(x=>x!==k);
    cambio();return;
  }
  if(el.dataset.sal){
    const c=claseDe(F.clase);const s=new Set(salvacionesDe(c));
    el.checked?s.add(el.dataset.sal):s.delete(el.dataset.sal);
    F.sal=CARS.filter(k=>s.has(k));cambio();return;
  }
  if(el.dataset.hab){F.hab[el.dataset.hab]=el.checked?1:0;cambio();return;}
  if(el.dataset.per){F.hab[el.dataset.per]=el.checked?2:1;cambio();return;}
  if(el.dataset.uso){
    const k=el.dataset.uso,i=+el.dataset.i;
    F.usados[k]=el.checked?i+1:i;cambio();return;
  }
  if(el.dataset.prep){F.conjuros[+el.dataset.prep].prep=el.checked;guardar();return;}
  if(el.dataset.esp){cambio();return;}
  if(el.id==='q-lista')pintarResultados();
});
hoja.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.m){
    F.metodo=b.dataset.m;F.asig={};
    if(F.metodo==='compra')CARS.forEach(k=>F.base[k]=Math.min(15,Math.max(8,+F.base[k]||8)));
    if(F.metodo==='array'||F.metodo==='tirada')CARS.forEach(k=>F.base[k]=8);
    cambio();return;
  }
  if(b.dataset.p){
    const k=b.dataset.p,v=+F.base[k]+(+b.dataset.d);
    if(v>=8&&v<=15){F.base[k]=v;cambio();}
    return;
  }
  if(b.dataset.add){F.conjuros.push({n:b.dataset.add,prep:false});cambio();return;}
  if(b.dataset.quitar){F.conjuros.splice(+b.dataset.quitar,1);cambio();return;}
  if(b.id==='conj-propio'){
    const n=prompt('Nombre del conjuro o técnica:');if(!n||!n.trim())return;
    const nv=parseInt(prompt('Nivel (0 para truco):','1'))||0;
    F.conjuros.push({n:n.trim(),niv:Math.max(0,Math.min(9,nv)),prep:false,propio:true});cambio();return;
  }
  switch(b.dataset.a){
    case 'tirar':{
      F.tiradas=CARS.map(()=>{const d=Array.from({length:4},()=>1+Math.floor(Math.random()*6)).sort((a,b)=>b-a);return {dados:d,total:d[0]+d[1]+d[2]};});
      F.asig={};CARS.forEach(k=>F.base[k]=8);cambio();break;}

  }
});

document.addEventListener('click',e=>{

      const orig=datos.lista.find(x=>x.id===id);if(!orig)break;
      const f=JSON.parse(JSON.stringify(orig));f.id=nuevaId();f.nombre=(orig.nombre||'Sin nombre')+' (copia)';

    case 'borrar':{
      const f=datos.lista.find(x=>x.id===id);if(!f)break;
      if(!confirm(`¿Borrar «${f.nombre||'Sin nombre'}»? No se puede deshacer (salvo que la hayas exportado).`))break;
      datos.lista=datos.lista.filter(x=>x.id!==id);
      if(borrador&&borrador.id===id)borrador=null;
      persistir();pintarLista();break;}
    case 'exportar':exportar();break;
    case 'importar':$('archivo').click();break;

    case 'guardar':guardar();ir('#/');break;
  }

$('archivo').addEventListener('change',async e=>{

    if(!nuevas.length)throw new Error('sin fichas');
    nuevas.forEach(f=>{if(datos.lista.some(x=>x.id===f.id))f.id=nuevaId();datos.lista.push(f);});
    persistir();pintarLista();ir('#/');
    $('aviso-guardado').textContent=`Importadas ${nuevas.length} ficha(s).`;
  }catch(err){$('aviso-guardado').textContent='Ese archivo no es una exportación de fichas válida.';}
  e.target.value='';
});
$('imprimir').onclick=()=>print();

/* ——— Tema claro/oscuro (como el compendio) ——— */
const mqOscuro=matchMedia('(prefers-color-scheme: dark)');
const esOscuro=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':mqOscuro.matches;};
function aplicarTema(t){
  if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
  const o=esOscuro();$('tema').innerHTML=icono(o?'sol':'luna');
  $('tema').setAttribute('aria-label',o?'Cambiar a tema claro':'Cambiar a tema oscuro');
  document.querySelector('meta[name="theme-color"]').content=o?'#000000':'#f5f5f7';
}
$('tema').onclick=()=>{const n=esOscuro()?'light':'dark';try{localStorage.setItem('compendio-tema',n);}catch(e){}aplicarTema(n);};
let temaGuardado=null;try{temaGuardado=localStorage.getItem('compendio-tema');}catch(e){}
aplicarTema(temaGuardado);
mqOscuro.addEventListener('change',()=>{if(!document.documentElement.dataset.theme)aplicarTema(null);});

/* ——— Arranque: #clase=El_Pistolero (o o:mago) crea una ficha nueva con esa clase ——— */
opcionesClase();
window.addEventListener('hashchange',ruta);
ruta();
if(avisoGuardado)$('aviso-guardado').textContent=avisoGuardado;
</script>
