<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="Compendio de clases homebrew de D&amp;D 5e: 43 clases en siete ambientaciones.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya:wght@400;500;700&family=IM+Fell+English+SC&family=Shippori+Mincho+B1:wght@700;800&family=UnifrakturCook:wght@700&family=Cinzel:wght@600;700&display=swap">
<title>Compendio de Clases Homebrew</title>
<style>
/* ——— Base: claro por defecto, oscuro por sistema o por elección ——— */
:root{
  --bg:#f5f5f7;--card:#ffffff;--text:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);
  --chip:#e8e8ed;--zebra:#fafafc;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --nav:rgba(245,245,247,.78);--blue:#0071e3;
  --acento:#0071e3;--acento2:#5ac8fa;--titulo:-apple-system,"SF Pro Display","Segoe UI",sans-serif;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:rgba(255,255,255,.12);
    --chip:#2c2c2e;--zebra:#161618;--shadow:none;--nav:rgba(20,20,22,.78);--blue:#2997ff;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000;--card:#1c1c1e;--text:#f5f5f7;--sub:#98989d;--line:rgba(255,255,255,.12);
  --chip:#2c2c2e;--zebra:#161618;--shadow:none;--nav:rgba(20,20,22,.78);--blue:#2997ff;color-scheme:dark;
}

/* ——— Identidad por ambientación ——— */
[data-vol="jjk"]{--acento:#e0463a;--acento2:#8f9cff;--titulo:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
[data-vol="castlevania"]{--acento:#c2263a;--acento2:#e8c39e;--titulo:"UnifrakturCook","Old English Text MT",Georgia,serif}
[data-vol="rueda"]{--acento:#c99a3a;--acento2:#f0d58a;--titulo:"Cinzel","Trajan Pro",Georgia,serif}
[data-vol="cosmere"]{--acento:#4f8fe8;--acento2:#a9c8ff;--titulo:-apple-system,"SF Pro Display","Segoe UI",sans-serif}
[data-vol="eberron"]{--acento:#b8891f;--acento2:#e9cf7a;--titulo:"Alegreya SC",Georgia,serif}
[data-vol="bloodborne"]{--acento:#6b7a90;--acento2:#c9d1de;--titulo:"IM Fell English SC",Georgia,serif}
[data-vol="sueltas"]{--acento:#b86f3f;--acento2:#f0c9a4;--titulo:"Alegreya",Georgia,serif}
[data-vol="manual"]{--acento:#4d7c5a;--acento2:#a9d8b5;--titulo:"Alegreya",Georgia,serif}
[data-vol="razas"]{--acento:#7a5fb0;--acento2:#c9b6f0;--titulo:"Alegreya",Georgia,serif}
:root[data-theme="dark"] [data-vol="manual"]{--acento:#7fb88e}
:root[data-theme="dark"] [data-vol="razas"]{--acento:#a68ad8}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) [data-vol="rueda"],:root:not([data-theme="light"]) [data-vol="eberron"]{--acento:#e3b859}
  :root:not([data-theme="light"]) [data-vol="bloodborne"]{--acento:#9aa8bd}
  :root:not([data-theme="light"]) [data-vol="sueltas"]{--acento:#d9915f}
  :root:not([data-theme="light"]) [data-vol="castlevania"]{--acento:#e0445a}
}
:root[data-theme="dark"] [data-vol="rueda"],:root[data-theme="dark"] [data-vol="eberron"]{--acento:#e3b859}
:root[data-theme="dark"] [data-vol="bloodborne"]{--acento:#9aa8bd}
:root[data-theme="dark"] [data-vol="sueltas"]{--acento:#d9915f}
:root[data-theme="dark"] [data-vol="castlevania"]{--acento:#e0445a}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.47 var(--font);-webkit-font-smoothing:antialiased;overflow-x:clip}
button,input,a{font:inherit;color:inherit}
a{text-decoration:none}
::selection{background:color-mix(in srgb,var(--acento) 35%,transparent)}
:focus-visible{outline:2px solid var(--acento);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{margin:0 0 12px;color:var(--acento);font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* ——— Barra superior ——— */
.barra{position:sticky;top:0;z-index:12;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.barra .wrap{display:flex;align-items:center;gap:14px;height:52px;min-width:0}
.barra strong{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.migas{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden}
.migas a{color:var(--blue)}
.migas span{overflow:hidden;text-overflow:ellipsis}
.migas .sep{opacity:.5}
.buscar{margin-left:auto;min-width:0;width:min(300px,100%);height:32px;border-radius:999px;border:0;background:var(--chip);padding:0 14px;outline:none}
.buscar::placeholder{color:var(--sub)}
.crear{flex:none;font-size:14px;font-weight:600;color:var(--blue);white-space:nowrap}
.buscar[hidden]+.crear{margin-left:auto}
.tema{flex:none;width:32px;height:32px;border:0;border-radius:50%;background:var(--chip);cursor:pointer;display:grid;place-items:center;font-size:15px}
.progreso{position:fixed;left:0;right:0;top:52px;height:2px;z-index:11;background:var(--acento);transform-origin:0 50%;transform:scaleX(0)}

/* ——— Inicio ——— */
.portada{padding-block:clamp(48px,9vw,104px) 36px}
.portada h1{margin:0;font-size:clamp(44px,8vw,84px);line-height:1.02;font-weight:700;letter-spacing:-.035em;text-wrap:balance}
.portada h1 span{color:var(--sub)}
.lead-inicio{max-width:44ch;margin:20px 0 0;color:var(--sub);font-size:clamp(19px,2.2vw,24px);line-height:1.35;letter-spacing:-.01em}
.filtros{display:grid;gap:14px;padding-bottom:36px}
.seg,.vols{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.vols button{border:0;border-radius:999px;background:var(--chip);padding:8px 14px;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,color .2s,transform .2s}
.seg button:active,.vols button:active{transform:scale(.97)}
.seg button[aria-pressed="true"],.vols button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.vols i{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c)}
.recuento{margin:0;color:var(--sub);font-size:14px}

.grupo{padding-bottom:56px}
.grupo-cab{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:6px 24px;margin-bottom:22px;padding-top:8px;border-top:2px solid var(--acento)}
.grupo-cab h2{margin:0;font-family:var(--titulo);font-size:clamp(28px,4vw,40px);line-height:1.1;letter-spacing:-.02em;color:var(--text)}
.grupo-cab p{grid-column:1;margin:0;color:var(--sub);font-size:15px;max-width:60ch}
.grupo-cab span{grid-row:1/3;grid-column:2;color:var(--acento);font-size:14px;font-weight:600;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:20px;padding-bottom:24px}
.grupo .grid{padding-bottom:0}
.tarjeta-clase{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-width:0;border-radius:22px;background:var(--card);box-shadow:var(--shadow);padding:26px;animation:subir .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 35ms);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.tarjeta-clase::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--acento),var(--acento2))}
.tarjeta-clase:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 18px 40px color-mix(in srgb,var(--acento) 16%,transparent)}
.mono{position:absolute;right:18px;top:12px;font:700 74px/1 var(--titulo);color:var(--acento);opacity:.14;pointer-events:none;user-select:none}
.etiqueta{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acento)}
.tarjeta-clase h2{margin:4px 0 0;font-family:var(--titulo);font-size:clamp(22px,2.4vw,25px);line-height:1.15;font-weight:600;letter-spacing:-.02em;text-wrap:balance;position:relative}
.lema{margin:0;font-weight:500;font-size:15px;position:relative}
.desc{margin:0;color:var(--sub);font-size:15px;line-height:1.4;position:relative}
.meta{margin-top:auto;padding-top:12px;color:var(--sub);font-size:13px;position:relative}
.abrir{color:var(--acento);font-size:15px;font-weight:600;position:relative}
.vacio{padding:48px 0;color:var(--sub);text-align:center}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ——— Vista de clase ——— */
.hero{position:relative;overflow:hidden;background:radial-gradient(900px 480px at 88% -12%,color-mix(in srgb,var(--acento) 26%,transparent),transparent 62%),var(--bg)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(24px,5vw,64px);align-items:center;padding-block:clamp(40px,7vw,88px) clamp(36px,5vw,64px)}
.hero h1{margin:0;font-family:var(--titulo);font-size:clamp(44px,7vw,80px);line-height:1.02;font-weight:700;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.hero .lema{margin-top:18px;font-size:clamp(19px,2.2vw,24px);color:var(--sub);letter-spacing:-.01em;max-width:42ch;line-height:1.35}
.hero-arte{position:relative;width:clamp(150px,22vw,250px);aspect-ratio:1;flex:none}
.emblema{position:absolute;inset:0;width:100%;height:100%;fill:none;stroke:var(--acento);stroke-width:2.2;opacity:.55}
.mono-grande{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(96px,14vw,160px)/1 var(--titulo);color:var(--acento);text-shadow:0 10px 40px color-mix(in srgb,var(--acento) 35%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chips span{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--sub)}
.vista{display:grid;grid-template-columns:200px minmax(0,1fr);gap:56px;padding-bottom:64px;align-items:start}
.indice{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);padding-left:4px}
.indice button{border:0;background:none;text-align:left;padding:7px 12px;margin-left:-6px;border-radius:10px;color:var(--sub);font-size:14px;cursor:pointer;line-height:1.3;transition:color .2s,background .2s}
.indice button:hover{color:var(--text);background:var(--chip)}
.indice button[aria-current="true"]{color:var(--acento);font-weight:600;background:color-mix(in srgb,var(--acento) 12%,transparent)}
.contenido{min-width:0;max-width:760px}
.seccion{padding-bottom:56px;scroll-margin-top:76px}
.anim .seccion{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1)}
.anim .seccion.visible{opacity:1;transform:none}
.seccion h2{margin:0 0 22px;font-family:var(--titulo);font-size:clamp(28px,4vw,40px);line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.seccion h3{margin:30px 0 10px;font-size:22px;line-height:1.2;font-weight:600;letter-spacing:-.02em;color:var(--acento)}
.seccion h4{margin:22px 0 8px;font-size:18px;font-weight:600}
.seccion h3.subclase{margin:44px 0 14px;padding-top:18px;border-top:2px solid var(--acento);font-family:var(--titulo);font-size:clamp(24px,3vw,30px);color:var(--text)}
.seccion p,.seccion li{font-size:17px;line-height:1.6}
.seccion p{margin:0 0 14px}
.seccion p.lead{font-size:clamp(20px,2.4vw,23px);line-height:1.45;color:var(--sub);letter-spacing:-.01em;margin-bottom:26px}
.seccion ul,.seccion ol{padding-left:22px;margin:0 0 16px}
.seccion li{margin-bottom:6px}
.seccion strong{font-weight:600}
.seccion blockquote{margin:20px 0;padding:4px 0 4px 18px;border-left:3px solid var(--acento);color:var(--sub);font-style:italic}
.seccion .bloque{margin:0 0 10px;font-size:16px;line-height:1.5}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:14px;margin-bottom:16px}
.tarjeta{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border-top:3px solid color-mix(in srgb,var(--acento) 70%,transparent);padding:20px 22px;margin:0 0 14px;font-size:16px;line-height:1.5}
.tarjetas .tarjeta{margin:0}
.tarjeta>*:first-child{margin-top:0}
.tarjeta h3{margin-top:0}
.tabla-wrap{overflow-x:auto;border-radius:16px;background:var(--card);box-shadow:var(--shadow);margin:8px 0 26px;-webkit-overflow-scrolling:touch}
.seccion table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:460px}
.seccion th,.seccion td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;transition:background .15s}
.seccion th{position:sticky;top:0;background:var(--chip);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.seccion tbody tr:nth-child(even){background:var(--zebra)}
.seccion tbody tr:hover td{background:color-mix(in srgb,var(--acento) 9%,transparent)}
.seccion tbody tr:last-child td{border-bottom:0}
.sec-tabla td:first-child{font-weight:700;color:var(--acento);font-variant-numeric:tabular-nums}
.pie{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding:28px 0 56px}
.pie a{color:var(--blue);font-size:15px;font-weight:500}
.pie a[aria-disabled="true"]{color:var(--sub);pointer-events:none}
.pie .ficha{color:var(--acento);font-weight:600}

/* ——— Iconos ——— */
.ico{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}

/* ——— Menú lateral ——— */
.barra .wrap{max-width:none}
.menu-btn{flex:none;width:34px;height:34px;border:0;border-radius:10px;background:var(--chip);cursor:pointer;display:grid;place-items:center;font-size:18px}
.secciones{display:flex;gap:4px;min-width:0}
.secciones a{padding:6px 11px;border-radius:999px;font-size:14px;color:var(--sub);white-space:nowrap}
.secciones a:hover{color:var(--text);background:var(--chip)}
.secciones a[aria-current="true"]{color:var(--text);background:var(--chip);font-weight:600}
.menu{position:fixed;top:53px;bottom:0;left:0;z-index:10;width:288px;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-right:1px solid var(--line);padding:14px 12px 48px;transition:transform .3s cubic-bezier(.2,.7,.2,1);font-size:14px}
.m-buscar{width:100%;height:36px;border:0;border-radius:10px;background:var(--chip);padding:0 12px;margin-bottom:12px;outline:none}
.menu a{display:block}
/* Nivel 1: Lobby, apartados y Personajes, alineados con su icono */
.menu .m-raiz,.m-sec>summary{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-weight:600;font-size:15px;color:var(--text)}
.m-raiz .ico,.m-sec>summary .ico{width:18px;height:18px;color:var(--sub)}
.m-raiz:hover,.m-sec>summary:hover{background:var(--chip)}
.m-raiz[aria-current="true"]{background:var(--chip)}
.m-sec{margin:2px 0}
.menu details>summary{list-style:none;cursor:pointer}
.menu details>summary::-webkit-details-marker{display:none}
.menu details>summary>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu details>summary small{color:var(--sub);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
.menu details>summary::after{content:"";flex:none;width:6px;height:6px;margin:0 4px 0 2px;border-right:1.5px solid var(--sub);border-bottom:1.5px solid var(--sub);transform:rotate(-45deg);transition:transform .2s}
.menu details[open]>summary::after{transform:rotate(45deg)}
/* Nivel 2 y 3: una línea guía por nivel y la misma sangría siempre */
.m-hijos{margin:2px 0 8px 19px;padding-left:10px;border-left:1px solid var(--line)}
.m-todo{padding:6px 8px;border-radius:8px;font-size:13px;color:var(--blue)}
.m-todo:hover{background:var(--chip)}
.m-vol>summary{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;color:var(--text)}
.m-vol>summary:hover{background:var(--chip)}
.m-vol>summary i{width:8px;height:8px;border-radius:50%;flex:none}
.m-vol>ul{margin:2px 0 6px 12px;padding-left:10px;border-left:1px solid var(--line)}
.m-hijos>ul{margin:2px 0 6px;padding:0}
.menu ul{list-style:none}
.menu li{display:flex;align-items:center;gap:2px}
.menu li a{flex:1;min-width:0;padding:5px 8px;border-radius:8px;color:var(--sub);line-height:1.3;cursor:grab;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;user-select:none}
.menu li a:hover{background:var(--chip);color:var(--text)}
.menu li a[aria-current="true"]{color:var(--blue);font-weight:600}
.m-fijar{flex:none;width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--sub);cursor:pointer;display:grid;place-items:center;opacity:.55}
.menu li:hover .m-fijar,.m-fijar:focus-visible,.m-fijar[aria-pressed="true"]{opacity:1}
.m-fijar:hover{background:var(--chip);color:var(--text)}
.m-fijar[aria-pressed="true"]{color:var(--blue)}
.velo{position:fixed;inset:53px 0 0 0;z-index:9;background:rgba(0,0,0,.35)}
@media (min-width:981px){
  .principal{margin-left:288px;transition:margin-left .3s cubic-bezier(.2,.7,.2,1)}
  body.menu-cerrado .principal{margin-left:0}
  body.menu-cerrado .menu{transform:translateX(-100%)}
  .velo{display:none}
}
@media (max-width:980px){
  .menu{transform:translateX(-100%);width:min(300px,86vw);box-shadow:var(--shadow)}
  body.menu-abierto .menu{transform:none}
}
@media (max-width:1180px){.secciones{display:none}}

/* ——— Lobby ——— */
.accesos{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:14px;padding-bottom:40px}
.acceso{position:relative;display:flex;flex-direction:column;gap:4px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:18px 20px;transition:transform .25s}
.acceso:hover{transform:translateY(-2px)}
.acceso-ico{position:absolute;right:18px;top:18px;color:var(--blue)}
.acceso-ico .ico{width:22px;height:22px}
.acceso b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.acceso span{font-weight:600}
.acceso small{color:var(--sub);font-size:13px;line-height:1.35}
.mesa-zona{padding-bottom:64px}
.mesa-cab{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:16px;padding-top:8px;border-top:2px solid var(--text)}
.mesa-cab h2{margin:0;font-size:clamp(26px,3.6vw,36px);letter-spacing:-.02em}
.mesa-cab span{color:var(--sub);font-size:14px}
.mesa-cab button{margin-left:auto;border:0;border-radius:999px;background:var(--chip);padding:7px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.mesa{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:18px;align-items:start;min-height:240px;padding:16px;border-radius:24px;border:2px dashed var(--line);transition:border-color .2s,background .2s}
body.arrastrando-algo .mesa{border-color:color-mix(in srgb,var(--blue) 45%,transparent)}
.mesa.recibe{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 7%,transparent)}
.mesa-vacia{grid-column:1/-1;margin:0;padding:64px 16px;text-align:center;color:var(--sub)}
.pin{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;border-radius:20px;background:var(--card);box-shadow:var(--shadow);padding:20px 22px;border-top:3px solid var(--acento);transition:box-shadow .2s,opacity .2s;cursor:grab}
.pin.con-img{padding-top:0;border-top:0;overflow:hidden}
.pin-img{display:block;width:calc(100% + 44px);margin:0 -22px 6px;height:150px;object-fit:cover;background:var(--chip)}
.pin.abierto{grid-column:1/-1;cursor:default}
.pin.abierto .pin-img{height:220px}
.pin.arrastrando{opacity:.35}
.pin.hueco-antes::before,.pin.hueco-despues::after{content:"";position:absolute;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--blue)}
.pin.hueco-antes::before{left:-11px}
.pin.hueco-despues::after{right:-11px}
.pin header{display:flex;align-items:center;gap:8px}
.asa{margin-left:auto;border:0;background:none;color:var(--sub);cursor:grab;padding:4px;border-radius:8px;touch-action:none;display:grid;place-items:center}
.asa:hover{background:var(--chip);color:var(--text)}
.pin h3{margin:0;font-family:var(--titulo);font-size:22px;line-height:1.15;letter-spacing:-.02em}
.pin .meta{margin-top:0;padding-top:0}
.pin-acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pin-acc a,.pin-acc button{border:0;border-radius:999px;background:var(--chip);padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pin-acc a{color:var(--acento);font-weight:600}
.pin-acc button:hover{background:var(--text);color:var(--bg)}
.pin-cuerpo{display:grid;gap:8px;margin-top:6px;cursor:auto}
.pin-cuerpo>details{border-radius:14px;background:var(--bg);padding:10px 16px}
.pin-cuerpo>details>summary{cursor:pointer;font-weight:600;padding:2px 0}
.anim .pin-cuerpo .seccion,.pin-cuerpo .seccion{opacity:1;transform:none;padding:8px 0 4px}
.pin-cuerpo .seccion h3{font-size:18px;margin:18px 0 6px}
.pin-cuerpo .seccion p,.pin-cuerpo .seccion li{font-size:15px}
.fantasma{position:fixed;left:0;top:0;z-index:50;pointer-events:none;display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.3);white-space:nowrap}
body.arrastrando-algo,body.arrastrando-algo *{user-select:none;cursor:grabbing!important}

/* ——— Imágenes de los libros (solo si existen en img/) ——— */
.hero-arte.con-img{width:clamp(220px,32vw,420px);aspect-ratio:4/3}
.hero-arte .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px;box-shadow:0 20px 50px color-mix(in srgb,var(--acento) 25%,rgba(0,0,0,.25))}
.tarjeta-clase.con-img{padding-top:0}
.tarjeta-clase .tc-img{display:block;width:calc(100% + 52px);margin:0 -26px 6px;height:150px;object-fit:cover;background:var(--chip)}
.lamina{margin:6px 0 26px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:var(--card)}
.lamina img{display:block;width:100%;max-height:420px;object-fit:cover}
.lamina figcaption{padding:8px 14px;font-size:13px;color:var(--sub)}
.sub-img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:4px 0 12px}

/* ——— Responsive ——— */
/* ——— Lectura por partes ——— */
.herr{position:sticky;top:70px;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 32px;padding:6px;border-radius:999px;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow);width:max-content;max-width:100%}
.herr button{border:0;background:var(--chip);border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s}
.herr button:hover{background:var(--text);color:var(--bg)}
.herr .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
details.seccion>summary{list-style:none;cursor:pointer}
details.seccion>summary::-webkit-details-marker{display:none}
details.seccion>summary h2{display:flex;align-items:center;gap:14px}
details.seccion>summary h2::after{content:"";flex:none;width:9px;height:9px;margin-left:auto;margin-right:6px;border-right:2px solid var(--acento);border-bottom:2px solid var(--acento);transform:rotate(45deg);transition:transform .3s}
details.seccion[open]>summary h2::after{transform:rotate(-135deg)}
details.seccion>summary:hover h2{color:var(--acento)}
.resumen{display:block;margin:-12px 0 26px;color:var(--sub);font-size:16px;line-height:1.5}
details.seccion[open] .resumen{display:none}
.cuerpo p,.cuerpo li,.cuerpo .bloque,.rasgo-cuerpo p,.rasgo-cuerpo li{font-size:var(--tam,17px)}
.cuerpo p{max-width:68ch}
.ficha-rapida{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:22px 24px;margin:0 0 36px;border-top:3px solid var(--acento)}
.fr-titulo{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acento)}
.ficha-rapida dl,.ficha-datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 24px;margin:0}
.ficha-datos{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border-top:3px solid var(--acento);padding:20px 22px;margin:8px 0 26px}
.ficha-rapida dt,.ficha-datos dt{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.ficha-rapida dd,.ficha-datos dd{margin:4px 0 0;font-size:15px;line-height:1.4}
.rasgo{background:var(--card);border-radius:16px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.rasgo>summary{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 20px;cursor:pointer;list-style:none;font-weight:600;font-size:18px;letter-spacing:-.01em}
.rasgo>summary::-webkit-details-marker{display:none}
.rasgo-nv{background:var(--acento);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.rasgo-tipo{margin-left:auto;font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap}
.rasgo-cuerpo{padding:0 20px 18px}
@media (max-width:860px){
  .vista{grid-template-columns:minmax(0,1fr);gap:24px}
  .indice{position:static;flex-direction:row;overflow-x:auto;gap:6px;border:0;padding:0 0 4px;scrollbar-width:none}
  .indice button{white-space:nowrap;background:var(--chip);color:var(--text);margin:0}
  .indice button[aria-current="true"]{background:var(--acento);color:#fff}
}
@media (max-width:640px){
  .barra strong{display:none}
  .migas .sep,.migas span:last-child{display:none}
  .buscar{width:100%}
  .hero .wrap{grid-template-columns:minmax(0,1fr);text-align:left}
  .hero-arte{width:min(180px,46vw);order:-1}
  .tarjeta-clase{padding:22px}
  .mono{font-size:60px}
  .grupo-cab{grid-template-columns:minmax(0,1fr)}
  .grupo-cab span{grid-row:auto;grid-column:1}
}

/* ——— Movimiento ——— */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
  .anim .seccion{opacity:1;transform:none}
  .tarjeta-clase:hover{transform:none}
}
::view-transition-old(root),::view-transition-new(root){animation-duration:.4s}

/* ——— Impresión ——— */
@media print{
  .barra,.progreso,.indice,.pie,.buscar,.tema,.filtros,.recuento,.herr{display:none!important}
  details{display:block}
  body,html{background:#fff;color:#000}
  .hero{background:none}
  .hero-arte{display:none}
  .seccion{break-inside:auto;padding-bottom:24px}
  .anim .seccion{opacity:1;transform:none}
  .tarjeta,.tabla-wrap{box-shadow:none;border:1px solid #ccc}
  .seccion th{position:static}
}
</style>
</head>
<body>
<nav class="barra">
  <div class="wrap">
    <button class="menu-btn" id="menu-btn" type="button" aria-label="Mostrar u ocultar el menú" aria-controls="menu" aria-expanded="true"></button>
    <strong id="marca">Compendio</strong>
    <nav class="migas" id="migas" aria-label="Ruta" hidden></nav>
    <nav class="secciones" id="secciones" aria-label="Apartados"></nav>
    <input class="buscar" id="q" type="search" placeholder="Buscar clase, raza, objeto o texto" aria-label="Buscar">
    <a class="crear" href="ficha.html">Personajes</a>
    <button class="tema" id="tema" type="button"></button>
  </div>
</nav>
<div class="progreso" id="progreso" hidden></div>

<aside class="menu" id="menu" aria-label="Menú del compendio">
  <input class="m-buscar" id="m-q" type="search" placeholder="Filtrar el menú" aria-label="Filtrar el menú">
  <div id="m-lista"></div>
</aside>
<div class="velo" id="velo" hidden></div>

<div class="principal">
<section id="lobby" hidden>
  <header class="portada wrap">
    <p class="eyebrow">Compendio D&amp;D 5e</p>
    <h1>Lobby.<br><span>Tu mesa de juego.</span></h1>
    <p class="lead-inicio">Arrastra clases, razas, objetos o ambientaciones desde el menú de la izquierda y colócalos en la mesa para tenerlos a la vista.</p>
  </header>
  <nav class="wrap accesos" id="accesos" aria-label="Apartados del compendio"></nav>
  <section class="wrap mesa-zona" aria-labelledby="mesa-tit">
    <div class="mesa-cab">
      <h2 id="mesa-tit">La mesa</h2>
      <span id="mesa-n"></span>
      <button type="button" id="vaciar">Vaciar mesa</button>
    </div>
    <div class="mesa" id="mesa"></div>
  </section>
</section>

<section id="inicio" hidden>
  <header class="portada wrap">
    <p class="eyebrow" id="p-eyebrow"></p>
    <h1 id="p-titulo"></h1>
    <p class="lead-inicio" id="p-lead"></p>
  </header>
  <section class="wrap filtros" aria-label="Filtros">
    <div class="seg pestanas" id="pestanas" role="tablist" aria-label="Qué mostrar">
      <button type="button" role="tab" data-p="clases" aria-selected="true" aria-pressed="true">Clases</button>
      <button type="button" role="tab" data-p="razas" aria-selected="false" aria-pressed="false">Razas</button>
      <button type="button" role="tab" data-p="objetos" aria-selected="false" aria-pressed="false">Objetos</button>
      <button type="button" role="tab" data-p="ambientaciones" aria-selected="false" aria-pressed="false">Ambientaciones</button>
    </div>
    <div class="seg" id="roles"></div>
    <div class="vols" id="vols"></div>
    <p class="recuento" id="recuento"></p>
  </section>
  <main class="wrap" id="rejilla"></main>
  <p class="vacio wrap" id="vacio" hidden>Nada coincide con la búsqueda.</p>
</section>

<article id="clase" hidden>
  <header class="hero">
    <div class="wrap">
      <div class="hero-txt" id="c-hero"></div>
      <div class="hero-arte" id="c-arte" aria-hidden="true"></div>
    </div>
  </header>
  <div class="wrap vista">
    <nav class="indice" id="c-indice" aria-label="Secciones"></nav>
    <div class="contenido" id="c-contenido"></div>
  </div>
  <div class="wrap">
    <div class="pie" id="c-pie"></div>
  </div>
</article>
</div>

<script src="datos.js"></script>

<script src="libros/phb2024.js"></script>
<script src="libros/xanathar.js"></script>
<script src="libros/tasha.js"></script>
<script src="libros/volo.js"></script>
<script src="libros/costa.js"></script>
<script src="libros/eberron.js"></script>
<script src="libros/spelljammer.js"></script>
<script src="libros/taldorei.js"></script>
<script src="libros/grimhollow.js"></script>
<script src="libros/obojima.js"></script>
<script src="libros/familias.js"></script>
<script src="libros/mundos/faerun.js"></script>
<script src="libros/mundos/khorvaire.js"></script>
<script src="libros/mundos/espacio.js"></script>
<script src="libros/mundos/taldorei.js"></script>
<script src="libros/mundos/etharis.js"></script>
<script src="libros/mundos/obojima.js"></script>
<script src="manual.js"></script>
<script src="iconos.js"></script>
<script src="img/imagenes.js"></script>
<script src="lector.js"></script>
<script>
const MAG=['Sin magia','Sobrenatural','Semilanzador','Lanzador'];
const ROLES=['Todos','Marcial','Semilanzador','Lanzador','Invocador','Astucia','Apoyo'];
const $=id=>document.getElementById(id);
const volOf=id=>VOL.find(v=>v.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sinTags=s=>s.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
const inicial=n=>(n.replace(/^(El|La|Los|Las)\s+/i,'').replace(/^\W+/,'').charAt(0)||'•').toUpperCase();
const reducido=matchMedia('(prefers-reduced-motion: reduce)').matches;
let rol='Todos',vol='todos';

/* ——— Emblemas: un motivo por ambientación, decorativo tras el monograma ——— */
const pol=(n,r,rot=0)=>Array.from({length:n},(_,k)=>{const a=rot+k*2*Math.PI/n;return `${(100+r*Math.cos(a)).toFixed(1)},${(100+r*Math.sin(a)).toFixed(1)}`}).join(' ');
const FORMAS={
  rueda:`<circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="16"/>`+
    Array.from({length:7},(_,k)=>{const a=k*2*Math.PI/7-Math.PI/2;return `<line x1="100" y1="100" x2="${(100+90*Math.cos(a)).toFixed(1)}" y2="${(100+90*Math.sin(a)).toFixed(1)}"/>`}).join(''),
  castlevania:`<circle cx="100" cy="100" r="88"/><path d="M100 22V178M48 72H152"/>`,
  cosmere:`<circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="66"/><circle cx="100" cy="100" r="42"/>`,
  eberron:`<polygon points="${pol(6,90,-Math.PI/2)}"/><polygon points="${pol(6,60,-Math.PI/2)}"/>`,
  bloodborne:`<path d="M124 20A82 82 0 1 0 180 142A66 66 0 1 1 124 20Z"/>`,
  sueltas:`<path d="M100 14L170 100L100 186L30 100Z"/><path d="M100 14V186M30 100H170"/>`,
  jjk:`<polygon points="${pol(6,90)}"/><path d="M100 10V190M10 100H190"/>`
};
const emblema=v=>`<svg class="emblema" viewBox="0 0 200 200" aria-hidden="true">${FORMAS[v.id]}</svg>`;

/* ——— Inicio ——— */
$('roles').innerHTML=ROLES.map(r=>`<button data-rol="${r}" aria-pressed="${r==='Todos'}">${r}</button>`).join('');
const COLOR={jjk:'#e0463a',castlevania:'#c2263a',rueda:'#c99a3a',cosmere:'#4f8fe8',eberron:'#b8891f',bloodborne:'#6b7a90',sueltas:'#b86f3f',manual:'#4d7c5a',razas:'#7a5fb0'};
/* Pestañas: «Clases» (homebrew y oficiales), «Razas», «Objetos» y «Ambientaciones»; cada volumen dice en qué pestaña va (p) */
let pestana='clases';
const pestanaDe=c=>c.raza?'razas':c.obj?'objetos':c.amb?'ambientaciones':'clases';
const enPestana=c=>pestanaDe(c)===pestana;
const volesDePestana=()=>VOL.filter(v=>(v.p||'clases')===pestana);
const NOMBRE_P={clases:'clases',razas:'razas',objetos:'libros con objetos',ambientaciones:'ambientaciones'};
function pintarVols(){
  $('vols').innerHTML=[{id:'todos',nombre:'Todos'},...volesDePestana()].map(v=>`<button data-vol="${v.id}" aria-pressed="${v.id==='todos'}">${COLOR[v.id]?`<i style="background:${COLOR[v.id]}"></i>`:''}${esc(v.nombre)}</button>`).join('');
}
pintarVols();
$('pestanas').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.dataset.p===pestana)return;
  location.hash='#/seccion/'+b.dataset.p;
};
const APARTADOS=[
  ['clases','Clases','espadas','Homebrew, del Manual y de los suplementos, con todas sus subclases.'],
  ['razas','Razas','gente','Pueblos jugables de todos los libros.'],
  ['objetos','Objetos','gema','Objetos mágicos, libro a libro.'],
  ['ambientaciones','Ambientaciones','mapa','Mundos: historia, regiones, facciones y aventuras.']];
const PORTADA={
  clases:['Clases.','Todos los mundos, un compendio.','Filtra por rol o por mundo y lee cada clase completa, sin salir de la página.'],
  razas:['Razas.','Pueblos de todos los libros.','Su origen, sus mejoras y sus rasgos, agrupados por libro.'],
  objetos:['Objetos.','Tesoros de cada libro.','Rareza, sintonización y qué hace cada objeto mágico.'],
  ambientaciones:['Ambientaciones.','Los mundos de juego.','Historia, regiones, facciones, religión y aventuras de cada mundo.']};
function elegirPestana(p){
  if(!PORTADA[p])p='clases';
  if(p!==pestana){pestana=p;vol='todos';rol='Todos';}
  [...$('pestanas').children].forEach(x=>{const on=x.dataset.p===p;x.setAttribute('aria-pressed',on);x.setAttribute('aria-selected',on);});
  $('roles').hidden=p!=='clases';
  const [t,sub,lead]=PORTADA[p];
  $('p-eyebrow').textContent=`Compendio D&D 5e · ${CLASES.filter(enPestana).length} ${NOMBRE_P[p]}`;
  $('p-titulo').innerHTML=`${esc(t)}<br><span>${esc(sub)}</span>`;
  $('p-lead').textContent=lead;
  marcar('roles','rol',rol);pintarVols();marcar('vols','vol',vol);
}

function marcar(contenedor,attr,valor){
  [...$(contenedor).children].forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===valor));
}

function textoDe(c){
  if(!c.texto)c.texto=[c.n,c.e,c.r,c.g,volOf(c.v).nombre,...c.secciones.map(s=>s.t+' '+sinTags(s.html))].join(' ').toLowerCase();
  return c.texto;
}

function metaDe(c){
  return c.meta?esc(c.meta):`${Lector.ROL_ICONO[c.r]||''} ${esc(c.r)}${c.raza?` · tamaño ${esc(c.tam)}`:` · dado ${esc(c.d)}${MAG[c.m]!==c.r?' · '+MAG[c.m]:''}`}`;
}

function tarjeta(c,i){
  const v=volOf(c.v);
  const img=imgDe(c.f);
  return `<a class="tarjeta-clase${img?' con-img':''}" data-vol="${v.id}" style="--i:${i}" href="#/clase/${esc(c.f)}">
    ${img?`<img class="tc-img" src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">`:`<span class="mono" aria-hidden="true">${esc(inicial(c.n))}</span>`}
    <span class="etiqueta">${esc(v.nombre)}</span>
    <h2>${esc(c.n)}</h2>
    <p class="lema">${esc(c.e)}</p>
    <p class="desc">${esc(c.g)}</p>
    <span class="meta">${metaDe(c)}</span>
    <span class="abrir">${pestanaDe(c)==='clases'?'Leer la clase':'Abrir'} →</span>
  </a>`;
}

function pintarInicio(){
  const q=$('q').value.trim().toLowerCase();
  const lista=CLASES.filter(c=>
    enPestana(c) &&
    (rol==='Todos'||c.r===rol) &&
    (vol==='todos'||c.v===vol) &&
    (!q||textoDe(c).includes(q)));
  const filtrado=q||rol!=='Todos'||vol!=='todos';
  $('rejilla').innerHTML=filtrado
    ? `<div class="grid">${lista.map(tarjeta).join('')}</div>`
    : volesDePestana().map(v=>{
        const grupo=lista.filter(c=>c.v===v.id);
        return `<section class="grupo" data-vol="${v.id}" aria-labelledby="g-${v.id}">
          <header class="grupo-cab">
            <h2 id="g-${v.id}">${v.marca?v.marca+' · ':''}${esc(v.nombre)}</h2>
            <span>${grupo.length} ${NOMBRE_P[pestana]}</span>
            <p>${esc(v.lema)}</p>
          </header>
          <div class="grid">${grupo.map(tarjeta).join('')}</div>
        </section>`;}).join('');
  $('vacio').hidden=lista.length>0;
  $('recuento').textContent=`${lista.length} de ${CLASES.filter(enPestana).length} ${NOMBRE_P[pestana]}`;
}

$('roles').onclick=e=>{const b=e.target.closest('button');if(!b)return;rol=b.dataset.rol;marcar('roles','rol',rol);pintarInicio();};
$('vols').onclick=e=>{const b=e.target.closest('button');if(!b)return;vol=b.dataset.vol;marcar('vols','vol',vol);pintarInicio();};
$('q').oninput=()=>{
  if(!$('inicio').hidden)pintarInicio();
  else if(!$('lobby').hidden&&$('q').value.trim())location.hash='#/seccion/'+pestana;
};

/* ——— Menú lateral: todo el compendio por apartado y grupo ——— */
const imgDe=f=>(window.IMAGENES||{})[f];
function pintarMenu(){
  const item=c=>`<li><a href="#/clase/${esc(c.f)}" draggable="false" data-f="${esc(c.f)}">${esc(c.n)}</a><button type="button" class="m-fijar" data-fijar="${esc(c.f)}" aria-pressed="false" aria-label="Poner ${esc(c.n)} en la mesa" title="Poner en la mesa">${icono('mas')}</button></li>`;
  $('m-lista').innerHTML=`<a class="m-raiz" href="#/">${icono('tablero')}<span>Lobby</span></a>`+APARTADOS.map(([p,nombre,ic])=>{
    const grupos=VOL.filter(v=>(v.p||'clases')===p).map(v=>[v,CLASES.filter(c=>c.v===v.id)]).filter(([,es])=>es.length);
    /* Un apartado con un solo grupo muestra sus entradas directamente */
    const hijos=grupos.length===1?`<ul>${grupos[0][1].map(item).join('')}</ul>`
      :grupos.map(([v,es])=>`<details class="m-vol"><summary>${COLOR[v.id]?`<i style="background:${COLOR[v.id]}"></i>`:''}<span>${esc(v.nombre)}</span><small>${es.length}</small></summary><ul>${es.map(item).join('')}</ul></details>`).join('');
    return `<details class="m-sec" data-p="${p}"><summary>${icono(ic)}<span>${esc(nombre)}</span><small>${CLASES.filter(c=>pestanaDe(c)===p).length}</small></summary>
      <div class="m-hijos"><a class="m-todo" href="#/seccion/${p}">Ver el apartado completo</a>${hijos}</div></details>`;}).join('')
    +`<a class="m-raiz" href="ficha.html">${icono('pergamino')}<span>Personajes</span></a>`;
  $('secciones').innerHTML=`<a href="#/">Lobby</a>`+APARTADOS.map(([p,n])=>`<a href="#/seccion/${p}">${esc(n)}</a>`).join('');
}
pintarMenu();
/* Marca dónde estás en el menú y en la barra, y abre su grupo */
function marcarMenu(){
  const h=decodeURIComponent(location.hash||'#/');
  const c=h.startsWith('#/clase/')?CLASES.find(x=>x.f===h.slice(8)):null;
  const sec=c?'#/seccion/'+pestanaDe(c):h;
  document.querySelectorAll('#m-lista a').forEach(a=>a.setAttribute('aria-current',decodeURIComponent(a.getAttribute('href'))===h));
  document.querySelectorAll('#secciones a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href')===sec));
  const actual=document.querySelector(`#m-lista details a[aria-current="true"]`);
  if(actual&&!$('m-q').value)for(let d=actual.closest('details');d;d=d.parentElement.closest('details'))d.open=true;
}
$('m-q').oninput=()=>{
  const q=$('m-q').value.trim().toLowerCase();
  document.querySelectorAll('#m-lista li').forEach(li=>{li.hidden=!!q&&!li.textContent.toLowerCase().includes(q);});
  document.querySelectorAll('#m-lista details').forEach(d=>{
    const hay=[...d.querySelectorAll('li')].some(li=>!li.hidden);
    d.hidden=!!q&&!hay;
    if(q)d.open=hay;
  });
};
const anchoEscritorio=matchMedia('(min-width:981px)');
function menuAbierto(){return anchoEscritorio.matches?!document.body.classList.contains('menu-cerrado'):document.body.classList.contains('menu-abierto');}
function ponerMenu(abrir){
  if(anchoEscritorio.matches){
    document.body.classList.toggle('menu-cerrado',!abrir);
    try{localStorage.setItem('compendio-menu',abrir?'1':'0');}catch(e){}
  } else {
    document.body.classList.toggle('menu-abierto',abrir);
    $('velo').hidden=!abrir;
  }
  $('menu-btn').setAttribute('aria-expanded',abrir);
}
try{if(localStorage.getItem('compendio-menu')==='0')document.body.classList.add('menu-cerrado');}catch(e){}
$('menu-btn').innerHTML=icono('menu');
$('menu-btn').setAttribute('aria-expanded',menuAbierto());
$('menu-btn').onclick=()=>ponerMenu(!menuAbierto());
$('velo').onclick=()=>ponerMenu(false);
anchoEscritorio.addEventListener('change',()=>{document.body.classList.remove('menu-abierto');$('velo').hidden=true;$('menu-btn').setAttribute('aria-expanded',menuAbierto());});

/* ——— Lobby: accesos y mesa ——— */
$('accesos').innerHTML=APARTADOS.map(([p,n,ic,d])=>`<a class="acceso" href="#/seccion/${p}"><span class="acceso-ico">${icono(ic)}</span><b>${CLASES.filter(c=>pestanaDe(c)===p).length}</b><span>${esc(n)}</span><small>${esc(d)}</small></a>`).join('')
  +`<a class="acceso" href="ficha.html"><span class="acceso-ico">${icono('pergamino')}</span><b>Fichas</b><span>Personajes</span><small>Crea y guarda fichas paso a paso.</small></a>`;

const CLAVE_MESA='compendio-mesa';
const existe=f=>CLASES.some(c=>c.f===f);
let mesa=[];
try{const g=JSON.parse(localStorage.getItem(CLAVE_MESA)||'[]');if(Array.isArray(g))mesa=g.filter(f=>typeof f==='string'&&existe(f));}catch(e){}
const expuestas=new Set();
function guardarMesa(){try{localStorage.setItem(CLAVE_MESA,JSON.stringify(mesa));}catch(e){}}
function cambiarMesa(){guardarMesa();pintarMesa();marcarFijadas();}
/* Pone f en la posición pos (o al final); si ya estaba, lo mueve */
function ponerEnMesa(f,pos){
  if(!existe(f))return;
  const i=mesa.indexOf(f);
  if(i>=0){mesa.splice(i,1);if(pos!=null&&pos>i)pos--;}
  mesa.splice(pos==null?mesa.length:Math.max(0,Math.min(pos,mesa.length)),0,f);
  cambiarMesa();
}
function quitarDeMesa(f){mesa=mesa.filter(x=>x!==f);expuestas.delete(f);cambiarMesa();}
function marcarFijadas(){
  document.querySelectorAll('[data-fijar]').forEach(b=>{const on=mesa.includes(b.dataset.fijar);b.setAttribute('aria-pressed',on);b.innerHTML=icono(on?'hecho':'mas');});
  const b=document.querySelector('#c-contenido [data-a="fijar"]');
  if(b)b.innerHTML=mesa.includes(b.dataset.f)?`${icono('hecho')} En la mesa`:`${icono('mas')} A la mesa`;
}
const conTablas=h=>h.replace(/<table/g,'<div class="tabla-wrap"><table').replace(/<\/table>/g,'</table></div>');
function pin(c){
  const v=volOf(c.v),ab=expuestas.has(c.f),img=imgDe(c.f);
  return `<article class="pin${ab?' abierto':''}${img?' con-img':''}" data-vol="${v.id}" data-f="${esc(c.f)}" aria-label="${esc(c.n)}">
    ${img?`<img class="pin-img" src="${esc(img)}" alt="" loading="lazy" draggable="false" onerror="this.remove()">`:''}
    <header><span class="etiqueta">${esc(v.nombre)}</span><button type="button" class="asa" aria-label="Arrastra para mover ${esc(c.n)}" title="Arrastra para mover">${icono('asa')}</button></header>
    <h3>${esc(c.n)}</h3>
    <p class="lema">${esc(c.e)}</p>
    <p class="desc">${esc(c.g)}</p>
    <span class="meta">${metaDe(c)}</span>
    ${ab?`<div class="pin-cuerpo">${c.secciones.map((s,k)=>`<details${k===0?' open':''}><summary>${esc(s.t)}</summary><div class="seccion pin-sec">${conTablas(s.html)}</div></details>`).join('')}</div>`:''}
    <div class="pin-acc">
      <a href="#/clase/${esc(c.f)}" draggable="false">${icono('libro')} Abrir</a>
      <button type="button" data-acc="ver" aria-expanded="${ab}">${icono(ab?'recoger':'expandir')} ${ab?'Recoger':'Exponer'}</button>
      <button type="button" data-acc="antes" aria-label="Mover antes" title="Mover antes">${icono('izquierda')}</button>
      <button type="button" data-acc="despues" aria-label="Mover después" title="Mover después">${icono('derecha')}</button>
      <button type="button" data-acc="quitar" aria-label="Quitar ${esc(c.n)} de la mesa" title="Quitar de la mesa">${icono('cerrar')}</button>
    </div>
  </article>`;
}
function pintarMesa(){
  const cs=mesa.map(f=>CLASES.find(c=>c.f===f));
  $('mesa').innerHTML=cs.length?cs.map(pin).join('')
    :`<p class="mesa-vacia">Arrastra aquí desde el menú de la izquierda lo que quieras tener a la vista, o pulsa ${icono('mas')} junto a cualquier nombre.</p>`;
  $('mesa-n').textContent=cs.length?`${cs.length} en la mesa`:'';
  $('vaciar').hidden=!cs.length;
}
$('vaciar').innerHTML=`${icono('papelera')} Vaciar mesa`;
$('vaciar').onclick=()=>{mesa=[];expuestas.clear();cambiarMesa();};
$('mesa').onclick=e=>{
  const b=e.target.closest('button[data-acc]');if(!b)return;
  const f=b.closest('.pin').dataset.f,i=mesa.indexOf(f);
  if(b.dataset.acc==='ver'){expuestas.has(f)?expuestas.delete(f):expuestas.add(f);pintarMesa();}
  else if(b.dataset.acc==='quitar')quitarDeMesa(f);
  else if(b.dataset.acc==='antes'&&i>0)ponerEnMesa(f,i-1);
  else if(b.dataset.acc==='despues'&&i<mesa.length-1)ponerEnMesa(f,i+2);
  const otra=$('mesa').querySelector(`.pin[data-f="${CSS.escape(f)}"] [data-acc="${b.dataset.acc}"]`);
  if(otra)otra.focus();
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-fijar]');if(!b)return;
  const f=b.dataset.fijar;mesa.includes(f)?quitarDeMesa(f):ponerEnMesa(f);
});

/* ——— Arrastrar con el puntero ———
   Ratón: desde un nombre del menú o desde cualquier parte libre de una ficha de la mesa.
   Dedo o lápiz: desde el asa de la ficha (en el menú se usa el botón +). */
let arr=null,anularEn=null;
function posicionEn(x,y){
  for(const p of $('mesa').querySelectorAll('.pin')){
    const r=p.getBoundingClientRect();
    if(y<r.top||(y<=r.bottom&&x<r.left+r.width/2))return mesa.indexOf(p.dataset.f);
  }
  return mesa.length;
}
function marcarHueco(pos){
  $('mesa').querySelectorAll('.hueco-antes,.hueco-despues').forEach(x=>x.classList.remove('hueco-antes','hueco-despues'));
  if(pos==null)return;
  const pins=$('mesa').querySelectorAll('.pin');
  if(pos<pins.length)pins[pos].classList.add('hueco-antes');
  else if(pins.length)pins[pins.length-1].classList.add('hueco-despues');
}
const sobreMesa=(x,y)=>{if($('lobby').hidden)return false;const r=$('mesa').getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;};
document.addEventListener('pointerdown',e=>{
  if(e.button!==0||arr)return;
  const enAsa=e.target.closest('#mesa .asa');
  const menu=e.target.closest('#m-lista li a[data-f]');
  const p=e.target.closest('#mesa .pin');
  let f=null,el=null;
  if(menu&&e.pointerType==='mouse'){f=menu.dataset.f;el=menu;}
  else if(p&&(enAsa||(e.pointerType==='mouse'&&!e.target.closest('a,button,summary,input,.pin-cuerpo')))){f=p.dataset.f;el=p;}
  if(!f)return;
  if(enAsa)e.preventDefault();
  arr={f,el,id:e.pointerId,x:e.clientX,y:e.clientY,activo:false,fantasma:null};
});
document.addEventListener('pointermove',e=>{
  if(!arr||e.pointerId!==arr.id)return;
  if(!arr.activo){
    if(Math.hypot(e.clientX-arr.x,e.clientY-arr.y)<6)return;
    arr.activo=true;
    const c=CLASES.find(x=>x.f===arr.f);
    arr.fantasma=document.createElement('div');
    arr.fantasma.className='fantasma';
    arr.fantasma.innerHTML=`${icono('asa')}<span>${esc(c.n)}</span>`;
    document.body.append(arr.fantasma);
    document.body.classList.add('arrastrando-algo');
    arr.el.classList.add('arrastrando');
    getSelection().removeAllRanges();
  }
  e.preventDefault();
  arr.fantasma.style.transform=`translate(${e.clientX+14}px,${e.clientY+14}px)`;
  const dentro=sobreMesa(e.clientX,e.clientY);
  $('mesa').classList.toggle('recibe',dentro);
  marcarHueco(dentro?posicionEn(e.clientX,e.clientY):null);
  if(e.clientY<90)scrollBy(0,-16);else if(e.clientY>innerHeight-50)scrollBy(0,16);
},{passive:false});
function soltar(e){
  if(!arr||e.pointerId!==arr.id)return;
  const a=arr;arr=null;
  if(!a.activo)return;
  anularEn=a.el;setTimeout(()=>{anularEn=null;},0);
  a.fantasma.remove();a.el.classList.remove('arrastrando');
  document.body.classList.remove('arrastrando-algo');$('mesa').classList.remove('recibe');marcarHueco(null);
  if(e.type==='pointerup'&&sobreMesa(e.clientX,e.clientY))ponerEnMesa(a.f,posicionEn(e.clientX,e.clientY));
}
document.addEventListener('pointerup',soltar);
document.addEventListener('pointercancel',soltar);
/* Tras arrastrar, el clic que sigue no abre el enlace */
document.addEventListener('click',e=>{if(anularEn&&anularEn.contains(e.target)){e.preventDefault();e.stopPropagation();anularEn=null;}},true);
document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('#m-lista,#mesa'))e.preventDefault();});

let observador=null;

/* Ilustraciones de los libros dentro de la página: una por subclase y una galería repartida en las ambientaciones */
function decorar(c){
  const figura=(src,pie)=>{const f=document.createElement('figure');f.className='lamina';f.innerHTML=`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.parentNode.remove()">${pie?`<figcaption>${esc(pie)}</figcaption>`:''}`;return f;};
  document.querySelectorAll('#c-contenido .sec-subclases .rasgo').forEach(r=>{
    const t=r.querySelector('.rasgo-tit'),src=t&&imgDe('s:'+t.textContent.trim());
    if(!src)return;
    const im=document.createElement('img');im.className='sub-img';im.src=src;im.alt='';im.loading='lazy';im.onerror=()=>im.remove();
    r.querySelector('.rasgo-cuerpo').prepend(im);
  });
  if(c.amb){
    const gal=imgDe('g:'+c.f.slice(2))||[];
    const cuerpos=[...document.querySelectorAll('#c-contenido details.seccion .cuerpo')].slice(1);
    gal.forEach((src,k)=>{const cu=cuerpos[Math.round((k+1)*cuerpos.length/(gal.length+1))-1];if(cu)cu.prepend(figura(src,''));});
  }
}

    </div>`+c.secciones.map((s,k)=>`
    <details class="seccion sec-${s.tipo}" id="sec-${k}" data-k="${k}" open>
      <summary><h2>${esc(s.t)}</h2><span class="resumen"></span></summary>
      <div class="cuerpo">${s.html.replace(/<table/g,'<div class="tabla-wrap"><table').replace(/<\/table>/g,'</table></div>')}</div>
    </details>`).join('');
  Lector.enriquecer(c,$('c-contenido'));
  decorar(c);

  const ant=CLASES[i-1], sig=CLASES[i+1];

    <a href="#/clase/${ant?esc(ant.f):''}" ${ant?'':'aria-disabled="true"'}>← ${ant?esc(ant.n):'Anterior'}</a>
    ${pestanaDe(c)!=='clases'?'':`<a class="ficha" href="ficha.html#clase=${encodeURIComponent(c.f)}">Crear personaje con esta clase →</a>`}
    ${c.oficial||pestanaDe(c)!=='clases'?'':`<a class="ficha" href="../clases/${esc(c.f)}.html" target="_blank" rel="noopener">Ficha original completa ↗</a>`}
    <a href="#/clase/${sig?esc(sig.f):''}" ${sig?'':'aria-disabled="true"'}>${sig?esc(sig.n):'Siguiente'} →</a>`;

  $('inicio').hidden=true;
  $('lobby').hidden=true;
  $('clase').hidden=false;

  $('migas').hidden=false;

/* Agrupa tarjetas consecutivas (subclases, rasgos) en una rejilla */
function agruparTarjetas(){
  document.querySelectorAll('#c-contenido .cuerpo').forEach(sec=>{
    let grupo=null;
    [...sec.children].forEach(el=>{
      if(el.classList.contains('tarjeta')){
        if(!grupo){grupo=document.createElement('div');grupo.className='tarjetas';el.before(grupo);}
        grupo.appendChild(el);
      } else grupo=null;
    });
  });
}

function activarIndice(){
  if(observador){observador.forEach(o=>o.disconnect());}
  const botones=[...$('c-indice').children];
  const marcarBoton=k=>botones.forEach((b,j)=>b.setAttribute('aria-current',String(j===k)));
  marcarBoton(0);
  const secciones=[...document.querySelectorAll('#c-contenido details.seccion')];
  /* Revelado: cada sección aparece al entrar en pantalla, con margen inferior */
  const revelar=new IntersectionObserver(entradas=>entradas.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add('visible');revelar.unobserve(e.target);}
  }),{rootMargin:'0px 0px -8% 0px'});
  /* Activa: la sección que ocupa la franja de lectura marca el índice */
  const activa=new IntersectionObserver(entradas=>{
    const visibles=entradas.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
    if(visibles.length)marcarBoton(+visibles[0].target.dataset.k);
  },{rootMargin:'-20% 0px -70% 0px'});
  secciones.forEach(s=>{revelar.observe(s);activa.observe(s);});
  if(secciones[0])secciones[0].classList.add('visible');
  if(reducido)secciones.forEach(s=>s.classList.add('visible'));
  observador=[revelar,activa];
}

$('c-indice').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  const sec=$('sec-'+b.dataset.k);
  sec.open=true;
  sec.scrollIntoView({behavior:reducido?'auto':'smooth',block:'start'});
};

/* ——— Opciones de lectura: desplegar, tamaño de letra, copiar enlace ——— */
const TAMANOS=[15,17,19,21];
let letra=1;
try{letra=Math.min(3,Math.max(0,+localStorage.getItem('compendio-letra')||1));}catch(e){}
function aplicarLetra(){ $('c-contenido').style.setProperty('--tam',TAMANOS[letra]+'px'); }
function cambiarLetra(d){
  letra=Math.min(3,Math.max(0,letra+d));
  try{localStorage.setItem('compendio-letra',String(letra));}catch(e){}
  aplicarLetra();
}
async function copiarEnlace(b){
  try{await navigator.clipboard.writeText(location.href);b.textContent='¡Copiado!';}
  catch(e){b.textContent='Copia la URL de la barra';}
  setTimeout(()=>{b.textContent='Copiar enlace';},1800);
}
$('c-contenido').onclick=e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const secs=[...document.querySelectorAll('#c-contenido details.seccion')];
  switch(b.dataset.a){
    case 'abrir': secs.forEach(d=>{d.open=true;}); break;
    case 'cerrar': secs.forEach(d=>{d.open=false;}); break;
    case 'menos': cambiarLetra(-1); break;
    case 'mas': cambiarLetra(1); break;
    case 'enlace': copiarEnlace(b); break;
    case 'fijar': mesa.includes(b.dataset.f)?quitarDeMesa(b.dataset.f):ponerEnMesa(b.dataset.f); break;
  }
};

  $('migas').hidden=true;
  $('q').hidden=false;
  if(observador){observador.forEach(o=>o.disconnect());observador=null;}
  pintarInicio();
}

/* Barra de progreso de lectura */
let pendiente=false;
function actualizarProgreso(){
  pendiente=false;
  const h=document.documentElement;
  const max=h.scrollHeight-h.clientHeight;
  $('progreso').style.transform=`scaleX(${max>0?Math.min(1,h.scrollTop/max):0})`;
}
addEventListener('scroll',()=>{ if(!pendiente){pendiente=true;requestAnimationFrame(actualizarProgreso);} },{passive:true});

/* Cambio de vista con transición, si el navegador la soporta */
function conTransicion(fn){
  if(document.startViewTransition&&!reducido)document.startViewTransition(fn);
  else fn();
}
function ruta(){
  conTransicion(()=>{
    const m=location.hash.match(/^#\/clase\/(.+)$/),s=location.hash.match(/^#\/seccion\/(\w+)$/);
    if(m)verClase(decodeURIComponent(m[1]));
    else if(s)verInicio(s[1]);
    else verLobby();
    marcarMenu();marcarFijadas();
    if(!anchoEscritorio.matches)ponerMenu(false);
  });
  window.scrollTo({top:0,behavior:'auto'});
}
window.addEventListener('hashchange',ruta);

/* ——— Tema claro/oscuro ——— */
const mqOscuro=matchMedia('(prefers-color-scheme: dark)');
function esOscuro(){
  const t=document.documentElement.dataset.theme;
  return t?t==='dark':mqOscuro.matches;
}
function aplicarTema(t){
  if(t)document.documentElement.dataset.theme=t;
  else delete document.documentElement.dataset.theme;
  const oscuro=esOscuro();
  const b=$('tema');
  b.innerHTML=icono(oscuro?'sol':'luna');
  b.setAttribute('aria-label',oscuro?'Cambiar a tema claro':'Cambiar a tema oscuro');
  document.querySelector('meta[name="theme-color"]').content=oscuro?'#000000':'#f5f5f7';
}
$('tema').onclick=()=>{
  const nuevo=esOscuro()?'light':'dark';
  try{localStorage.setItem('compendio-tema',nuevo);}catch(e){}
  aplicarTema(nuevo);
};
let guardado=null;
try{guardado=localStorage.getItem('compendio-tema');}catch(e){}
aplicarTema(guardado);
mqOscuro.addEventListener('change',()=>{ if(!document.documentElement.dataset.theme)aplicarTema(null); });

document.body.classList.toggle('anim',!reducido);
ruta();
</script>
</body>
</html>
